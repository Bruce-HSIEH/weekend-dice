<title>假日骰骰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* ===== 公路旅行明信片風 ===== */
:root{
  --ink:#2B3A55; --ink2:#6B7A93; --line:#D6E3F0;
  --sky1:#8FD0F5; --sky2:#C4E9FC; --sky3:#EAF7FF;
  --grass:#8FCF6B; --grass-d:#5FAF4A; --road:#5B6170; --lane:#FFD54A;
  --sun:#FFD54A; --coral:#FF7A59; --paper:#FFFBF1; --kraft:#E8D6B3;
  --t1:#3DAA6E; --t2:#3B8EDB; --t3:#F29A3A; --t4:#8A6BD1;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);background:#F2F8FD;
  font-family:"Huninn","jf-openhuninn","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;}
html.lock,html.lock body{overflow:hidden;touch-action:none}
body{overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 28px);
  background-image:linear-gradient(rgba(59,142,219,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,142,219,.06) 1px,transparent 1px);background-size:26px 26px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea{font-family:inherit;color:var(--ink)}
svg.ic{display:inline-block;vertical-align:middle;flex:none}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto}
.pad{padding:0 16px}

/* ---------- 風景（首頁上方） ---------- */
.scene{position:relative;height:calc(env(safe-area-inset-top) + 318px);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);border-radius:0 0 34px 34px}
.scene .sun{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 64px);width:58px;height:58px}
.scene .sun svg{animation:spinSlow 24s linear infinite;display:block}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.cloud{position:absolute;opacity:.95}
.cloud.c1{top:calc(env(safe-area-inset-top) + 92px);left:-20%;animation:drift 38s linear infinite}
.cloud.c2{top:calc(env(safe-area-inset-top) + 140px);left:-20%;animation:drift 52s linear -20s infinite;opacity:.8}
.cloud.c3{top:calc(env(safe-area-inset-top) + 58px);left:-20%;animation:drift 64s linear -40s infinite;opacity:.7}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(140vw)}}
.hills{position:absolute;left:0;right:0;bottom:70px;height:120px}
.hills svg{width:100%;height:100%;display:block}
.road{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--road);border-top:5px solid #454A57}
.road::before{content:"";position:absolute;left:0;right:0;top:34px;height:5px;background:repeating-linear-gradient(90deg,var(--lane) 0 28px,transparent 28px 52px)}
.road::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--grass-d)}
.topbar{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:flex-start;padding:0 16px;gap:8px;z-index:3}
.ttl{flex:1;min-width:0;text-align:center;padding-left:84px}
h1{margin:0;font-size:30px;font-weight:400;letter-spacing:.06em;line-height:1.2;white-space:nowrap;color:var(--ink);
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff,0 5px 0 rgba(43,58,85,.15)}
#h1t{display:inline-block;line-height:1.2}
.sub{font-size:13px;color:var(--ink);margin-top:2px;white-space:nowrap;opacity:.8}
.ver{display:inline-block;vertical-align:middle;margin-left:4px;border:2px solid var(--ink);background:var(--sun);border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;text-shadow:none;letter-spacing:0}
.snd{display:flex;gap:6px}
.snd button{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink);transition:.15s}
.snd button.off{background:#E3EAF2;opacity:.75}
.snd button.off svg{opacity:.45}
.snd button:active{transform:translateY(3px);box-shadow:none}

.dieWrap{position:absolute;left:50%;bottom:44px;width:120px;height:120px;margin-left:-60px;z-index:2}
.dieIdle{width:120px;height:120px;animation:dieIdle 3s ease-in-out infinite}
@keyframes dieIdle{50%{transform:translateY(-6px) rotate(-3deg)}}
.dieWrap svg{display:block;width:120px;height:120px;overflow:visible}
.dieShadow{position:absolute;left:50%;bottom:30px;width:96px;height:14px;margin-left:-52px;border-radius:50%;background:rgba(0,0,0,.22);z-index:1}
.carBtn{position:absolute;right:14px;bottom:40px;width:96px;height:66px;border:0;background:none;padding:0;z-index:2}
.carBtn svg{width:96px;height:66px;display:block;overflow:visible}
.car{animation:carIdle .5s ease-in-out infinite alternate}
@keyframes carIdle{to{transform:translateY(-1.5px)}}
.carBtn.honk .car{animation:honk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes honk{0%{transform:scale(1.12,.86)}45%{transform:scale(.94,1.08) translateY(-6px)}100%{transform:none}}
.carBtn.hot .car{animation:hot .1s linear infinite}
@keyframes hot{50%{transform:translateX(2px) rotate(1.5deg)}}
.carBtn.leave{animation:leave 2.6s cubic-bezier(.5,0,.4,1) both}
@keyframes leave{0%{transform:none}40%{transform:translateX(160px)}41%{transform:translateX(-520px)}100%{transform:none}}
.bubble{position:absolute;right:20px;bottom:116px;z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:4px 11px;font-size:14px;white-space:nowrap;
  opacity:0;transform:scale(.4) translateY(8px);transform-origin:80% 100%;transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.bubble::before{content:"";position:absolute;right:30px;bottom:-11px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble::after{content:"";position:absolute;right:31.5px;bottom:-7px;border:5.5px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{opacity:1;transform:none}

/* ---------- 路標 ---------- */
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-6px 0 0;padding:0 14px;position:relative;z-index:3}
.sign{position:relative;border:0;background:none;padding:0 0 20px;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.sign::before,.sign::after{content:"";position:absolute;bottom:0;width:6px;height:24px;background:#8E98A8;border:2px solid var(--ink);border-top:0;border-radius:0 0 3px 3px;z-index:-1}
.sign::before{left:28%} .sign::after{right:28%}
.sign .pl{display:block;border-radius:12px;border:2.5px solid var(--ink);padding:3px;box-shadow:0 4px 0 var(--ink)}
.sign .in{display:block;border:2px solid rgba(255,255,255,.9);border-radius:8px;color:#fff;padding:5px 2px 4px;text-align:center}
.sign .ex{display:inline-block;font-size:10px;background:#fff;color:var(--ink);border-radius:5px;padding:0 4px;line-height:15px}
.sign b{display:block;font-weight:400;font-size:15px;white-space:nowrap;margin-top:2px;letter-spacing:.04em}
.sign small{display:block;font-size:10.5px;white-space:nowrap;opacity:.95}
.sign .pin{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-6deg);background:var(--sun);border:2px solid var(--ink);border-radius:7px;font-size:11px;padding:0 6px;line-height:17px;white-space:nowrap}
.signs.locked .sign:not(.on){opacity:.4}
.sign.hit{animation:signHit .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes signHit{0%{transform:none}25%{transform:rotate(-7deg) scale(1.12)}50%{transform:rotate(5deg) scale(1.1)}75%{transform:rotate(-2deg) scale(1.06)}100%{transform:scale(1.04)}}
.sign.won .pl{box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--sun)}
.signTip{text-align:center;font-size:12px;color:var(--ink2);margin:6px 0 0}

.rollRow{display:flex;flex-direction:column;align-items:center;margin:14px 0 4px}
.rollBtn{width:132px;height:132px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#FFF1A8 0,var(--sun) 45%,#F5B82E 100%);
  box-shadow:0 7px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .1s,box-shadow .1s}
.rollBtn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.rollBtn:disabled{filter:saturate(.6);opacity:.85}
.rollBtn big{font-size:38px;line-height:1;letter-spacing:.05em}
.rollBtn span{font-size:16px}
.pool{text-align:center;font-size:13px;color:var(--ink2);margin-top:12px}
.pool b{color:var(--ink);font-weight:400;background:#fff;border:2px solid var(--line);border-radius:8px;padding:0 6px}

/* ---------- 行前檢查（條件） ---------- */
.board{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:26px 16px 16px;margin:24px 16px 0;box-shadow:5px 6px 0 rgba(43,58,85,.18)}
.board .clip{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:96px;height:30px}
.board h3{margin:0 0 4px;font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.board .note2{font-size:12px;color:var(--ink2);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:10px 8px}
.ltag{position:relative;border:2.5px solid var(--ink);background:#fff;border-radius:6px 14px 14px 6px;padding:6px 12px 6px 22px;font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:.15s}
.ltag::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;border:2px solid var(--ink);background:#F2F8FD}
.ltag.on{background:var(--grass);transform:rotate(-2deg)}
.ltag.on:nth-child(2n){transform:rotate(2deg)}
.modeLine{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--kraft);font-size:13px}
.modeLine button{margin-left:auto;border:2px solid var(--ink);background:#fff;border-radius:999px;font-size:12px;padding:3px 10px}

/* ---------- 名單（票根） ---------- */
.pageHead{padding:calc(env(safe-area-inset-top) + 16px) 16px 10px;background:linear-gradient(180deg,var(--sky2),rgba(234,247,255,0));}
.pageHead h2{margin:0;font-weight:400;font-size:26px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pageHead h2 small{font-size:13px;color:var(--ink2);margin-left:auto}
.search{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:0 14px;margin-top:12px}
.search input{flex:1;border:0;outline:0;font-size:16px;padding:10px 0;background:none;min-width:0}
.tierTabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none}
.tierTabs::-webkit-scrollbar{display:none}
.tierTabs button{flex:none;border:2.5px solid var(--ink);background:#fff;border-radius:9px;padding:4px 10px;font-size:13px;white-space:nowrap}
.tierTabs button.on{color:#fff}
.grpH{display:flex;align-items:center;gap:8px;font-size:16px;margin:16px 16px 8px}
.grpH i{display:inline-block;border-radius:6px;border:2px solid var(--ink);color:#fff;font-style:normal;font-size:12px;padding:0 7px;line-height:20px}
.grpH small{color:var(--ink2);font-size:12px}
.tk{display:flex;width:calc(100% - 32px);margin:0 16px 10px;padding:0;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);text-align:left;position:relative;box-shadow:0 3px 0 rgba(43,58,85,.2)}
.tk:active{transform:scale(.98)}
.tk .stub{flex:none;width:62px;color:#fff;border-radius:11px 0 0 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;border-right:2.5px dashed rgba(255,255,255,.95)}
.tk .stub small{font-size:10px;margin-top:2px}
.tk::before,.tk::after{content:"";position:absolute;left:53px;width:14px;height:14px;border-radius:50%;background:#F2F8FD;border:2.5px solid var(--ink)}
.tk::before{top:-9px;clip-path:inset(50% 0 0 0)} .tk::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.tk .tx{flex:1;min-width:0;padding:9px 10px 9px 14px}
.tk .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .ar{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tk .tg{display:flex;gap:2px;align-items:center;padding-right:10px;flex:none}
.tk.off{opacity:.5}
.badge{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px;background:var(--sun);border:1.5px solid var(--ink);line-height:15px}
.badge.gray{background:#E3EAF2}
.empty{text-align:center;color:var(--ink2);padding:30px 16px;line-height:1.7}
.fab{position:fixed;right:calc(50% - min(50vw,260px) + 18px);bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 26px);z-index:40;width:60px;height:60px;border-radius:50%;
  border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:0}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ---------- 足跡 ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 16px 0}
.stat{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(43,58,85,.2)}
.stat b{display:block;font-weight:400;font-size:30px;line-height:1.1}
.stat small{font-size:12px;color:var(--ink2)}
.trail{position:relative;margin:18px 16px 0;padding-left:26px}
.trail::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(180deg,var(--ink2) 0 8px,transparent 8px 14px);border-radius:2px}
.stop{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.stop::before{content:"";position:absolute;left:-25px;top:12px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:var(--c,#fff)}
.stop .d{font-size:12px;color:var(--ink2)}
.stop .n{font-size:16px}
.settings{margin:22px 16px 0;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;overflow:hidden}
.set{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:2px dashed var(--kraft);font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.set:last-child{border-bottom:0}
.set .r{margin-left:auto;color:var(--ink2);font-size:13px}
.set.danger{color:#C2563B}
footer{text-align:center;font-size:12px;color:var(--ink2);margin-top:22px;line-height:1.7}

/* ---------- 底部導覽列 ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 24px);max-width:496px;height:var(--nav-h);z-index:50;
  background:var(--ink);border-radius:24px;display:flex;padding:7px;gap:6px;box-shadow:0 6px 18px rgba(43,58,85,.28)}
.nav button{flex:1;border:0;background:none;border-radius:17px;color:#C9D6EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:0;transition:.2s}
.nav button.on{background:var(--sun);color:var(--ink)}
.nav button svg{transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}

/* ---------- 彈出視窗 ---------- */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(43,58,85,.42);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#overlay.show{opacity:1;pointer-events:auto}
.sheet{position:relative;width:100%;max-width:420px;max-height:66vh;max-height:66dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 8px 0 rgba(43,58,85,.35);transform:translateY(30px) rotate(-2deg);transition:transform .32s cubic-bezier(.2,1.4,.4,1)}
#overlay.show .sheet{transform:none}
.xWrap{position:sticky;top:0;height:0;z-index:5}
.xBtn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;z-index:5;box-shadow:0 3px 0 var(--ink)}
.sheetBody{padding:16px 18px 18px}
.form,.log{padding-top:20px}
.form h2,.log h3{padding-right:44px}

/* 明信片 */
.pc .view{height:132px;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.pc .view svg{width:100%;height:100%;display:block}
.pc .stamp{position:absolute;right:58px;top:14px;width:66px;height:86px;background:#fff;padding:5px;transform:rotate(4deg);border:2px solid var(--ink);border-radius:3px;
  box-shadow:0 0 0 4px #fff,0 0 0 6px var(--ink),3px 5px 0 6px rgba(43,58,85,.25)}
.pc .stamp .si{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#fff;border-radius:2px}
.pc .pm{position:absolute;right:92px;top:46px;width:76px;height:76px;transform:rotate(-14deg);opacity:.8;pointer-events:none}
.pc .to{font-size:13px;color:var(--ink2);letter-spacing:.2em}
.pc h2{margin:2px 0 6px;font-weight:400;font-size:27px;line-height:1.25;padding-right:4px}
.pc .addr{font-size:15px;border-bottom:2px dotted var(--kraft);padding:4px 0;display:flex;align-items:center;gap:6px}
.pc .stk{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.stkr{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 9px 3px 5px;font-size:13px;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(43,58,85,.25)}
.stkr:nth-child(2n){transform:rotate(2.5deg)}
.pc .msg{font-size:16px;line-height:30px;background:repeating-linear-gradient(180deg,transparent 0 28px,#E4D3B2 28px 30px);padding:0 2px;min-height:30px}

/* ===== 實心手繪骰子（圓角正面＋往右上擠出的厚度，全部不透明） ===== */
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],
  5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[29,24],[29,50],[29,76],[71,24],[71,50],[71,76]]};
const pipSet=(n,r)=>PIPS[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${n===1?r*1.45:r}" fill="${n===1?"#F2735A":INK}"/>`).join("");
// 圓角方塊往右上「擠出」厚度：同一個圓角形狀疊 10 層，所有邊角一樣圓
let dieUid=0;
function dieSvg(n){
  const id="dg"+(++dieUid);   // SVG 漸層 id 要唯一，避免多顆骰子互相蓋掉
  const X=12,Y=30,S=84,R=24,DX=13,DY=-13,K=10;
  const layers=[]; for(let i=K;i>=1;i--) layers.push([DX*i/K,DY*i/K]);
  const rect=(dx,dy,extra)=>`<rect x="${X+dx}" y="${Y+dy}" width="${S}" height="${S}" rx="${R}" ${extra}/>`;
  const pip=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-r*.32}" cy="${y-r*.34}" r="${r*.3}" fill="#fff" opacity=".5"/>`;
  const pips=PIPS[n].map(([x,y])=>{ const px=X+8+x*.68, py=Y+8+y*.68; return n===1?pip(px,py,13,"#F2735A"):pip(px,py,7.6,INK); }).join("");
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF4FB"/><stop offset="1" stop-color="#B9CCE3"/></linearGradient></defs>
    ${layers.map(([dx,dy])=>rect(dx,dy,`fill="${INK}" stroke="${INK}" stroke-width="10"`)).join("")}
    ${layers.map(([dx,dy])=>rect(dx,dy,`fill="url(#${id})"`)).join("")}
    ${rect(0,0,`fill="#fff" stroke="${INK}" stroke-width="5"`)}
    <path d="M${X+14} ${Y+R*.9} Q${X+14} ${Y+12} ${X+R+10} ${Y+11}" fill="none" stroke="#E3ECF7" stroke-width="5" stroke-linecap="round"/>
    ${pips}`;
}
function faceMini(n,s=18,bg="#fff"){
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="20" fill="${bg}" stroke="${INK}" stroke-width="8"/>${pipSet(n,9)}</svg>`;
}

/* ===== 地點資料：內建名單＋使用者改的（像 FW 的 default table + NVM 覆寫） ===== */
const BASE = BASE_RAW.map(([name,area,min,tg,note])=>({id:"b:"+name,name,area,min,tags:[...tg],note,off:false}));
function spots(){
  const del=new Set(data.deleted);
  return BASE.filter(s=>!del.has(s.id)).map(s=>data.edits[s.id]?Object.assign({},s,data.edits[s.id]):s).concat(data.added);
}
const saveData=()=>store.set("wd_data",data);
const visitedRecently = id=>hist.some(h=>h.id===id && Date.now()-h.t < 30*864e5);
const lastVisit = id=>hist.filter(h=>h.id===id).reduce((a,h)=>Math.max(a,h.t),0);
function passes(s){
  if(s.off) return false;
  for(const t of TAGS) if(flt[t.key] && !s.tags.includes(t.ch)) return false;
  if(flt.avoid && visitedRecently(s.id)) return false;
  return true;
}
const poolOf = tier=>spots().filter(s=>tierOf(s.min)===tier && passes(s));

<script>
/* ===== 音效 & 背景音樂 ===== */
const Snd = (()=>{
  let ctx=null, sfxBus=null;
  let sfxOn = store.get("wd_sfx",true), bgmOn = store.get("wd_bgm",false);
  const N=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx) { if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC({latencyHint:"playback"});
      sfxBus=ctx.createGain(); sfxBus.gain.value=sfxOn?1:0; sfxBus.connect(ctx.destination);
    }catch(e){ return false; }
    if(bgmOn) startBgm();
    return true;
  }
  function tone(f,d,o={}){
    const t=ctx.currentTime+(o.at||0), os=ctx.createOscillator(), g=ctx.createGain();
    os.type=o.type||"sine"; os.frequency.setValueAtTime(f,t); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(o.vol||.15,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g); g.connect(sfxBus); os.start(t); os.stop(t+d+.05);
  }
  let nbuf=null;
  function noise(d,o={}){
    if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate); const a=nbuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
    const t=ctx.currentTime+(o.at||0), s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=nbuf; f.type=o.type||"bandpass"; f.frequency.value=o.freq||1800; f.Q.value=o.Q||1.2;
    g.gain.setValueAtTime(o.vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t+d+.02);
  }
  const sfx={
    pop(){ tone(520,.12,{to:900,vol:.16}); },
    toggle(on){ tone(on?660:440,.09,{vol:.12}); tone(on?990:330,.12,{vol:.1,at:.07}); },
    // 骰子在桌上咔啦咔啦：一串越來越慢的木頭碰撞聲
    rattle(){ let t=0; for(let i=0;i<11;i++){ t+=.05+i*.012; noise(.05,{at:t,freq:1400+Math.random()*1600,Q:3,vol:.22-i*.012}); tone(300+Math.random()*200,.04,{at:t,vol:.05,type:"triangle"}); } },
    land(){ noise(.12,{freq:420,Q:.8,vol:.35,type:"lowpass"}); tone(150,.18,{to:70,vol:.25}); },
    tada(){ [72,76,79,84].forEach((m,i)=>tone(N(m),.32,{at:i*.09,vol:.12,type:"triangle"})); tone(N(88),.6,{at:.36,vol:.1}); },
    cheer(){ for(let i=0;i<14;i++) noise(.08,{at:i*.035,freq:3000+Math.random()*3000,Q:4,vol:.07}); [79,84,88].forEach((m,i)=>tone(N(m),.25,{at:.05+i*.07,vol:.09})); },
    // 叭叭！兩聲方波喇叭
    honk(){ [0,.2].forEach(a=>{ tone(392,.14,{at:a,vol:.07,type:"square"}); tone(494,.14,{at:a,vol:.06,type:"square"}); }); },
    steam(){ noise(.9,{freq:5000,Q:.5,vol:.12,type:"highpass"}); for(let i=0;i<4;i++) tone(140,.08,{at:i*.12,vol:.12,type:"sawtooth",to:110}); },
    vroom(){ tone(90,1.1,{to:260,vol:.12,type:"sawtooth"}); noise(1,{freq:300,Q:.6,vol:.08,type:"lowpass"}); },
    oops(){ tone(330,.14,{vol:.12,type:"triangle"}); tone(262,.22,{at:.12,vol:.12,type:"triangle"}); },
  };

  /* 背景音樂：輕快的出遊小曲，8 小節循環。
     載入時用 OfflineAudioContext 先「錄」成 WAV 交給 <audio loop>，像 FW 用 DMA 循環 buffer 播音，CPU 忙也不會斷 */
  const BPM=120, S16=60/BPM/4, LOOP=S16*16*8;
  const MEL=[
    67,0,71,74, 0,71,69,67,
    69,0,71,72, 71,69,67,0,
    72,0,76,74, 72,71,69,0,
    71,74,72,69, 67,0,0,0,
    67,71,74,79, 0,78,76,74,
    72,0,74,76, 74,72,71,0,
    69,72,71,69, 67,66,64,66,
    67,0,62,0,  67,0,0,0 ];
  const CH=[[43,59,62,67],[45,57,60,64],[48,60,64,67],[50,57,62,66],[43,59,62,67],[48,60,64,67],[45,57,60,64],[50,57,62,66]];
  const BGM_SR=32000, BGM_VOL=.4;
  let bgmEl=null, bgmReady=false, bgmWant=false, bgmPlaying=false;
  function encodeWav(f32,sr){
    const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i));};
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7FFF, true); }
    return new Blob([buf],{type:"audio/wav"});
  }
  function prepareBgm(){
    try{
      const sr=BGM_SR, TAIL=1.2;
      const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC) return;
      const oc=new OAC(1,Math.ceil((LOOP+TAIL)*sr),sr);
      const out=oc.createGain(); out.gain.value=BGM_VOL; out.connect(oc.destination);
      const nb=oc.createBuffer(1,Math.floor(sr*.2),sr); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      const env=(g,t,v,a,d)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);};
      // 口哨：正弦波＋一點顫音
      const whistle=(f,t,v,d)=>{const o=oc.createOscillator(),lfo=oc.createOscillator(),lg=oc.createGain(),g=oc.createGain();
        o.frequency.value=f*2;lfo.frequency.value=5.5;lg.gain.value=f*.012;lfo.connect(lg);lg.connect(o.frequency);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.setValueAtTime(v,t+d*.6);g.gain.exponentialRampToValueAtTime(.0001,t+d);
        o.connect(g);g.connect(out);o.start(t);lfo.start(t);o.stop(t+d+.05);lfo.stop(t+d+.05);};
      // 烏克麗麗：三角波短音，刷弦時每根弦錯開一點點
      const uke=(f,t,v)=>{const o=oc.createOscillator(),g=oc.createGain();o.type="triangle";o.frequency.value=f;env(g,t,v,.004,.35);o.connect(g);g.connect(out);o.start(t);o.stop(t+.4);};
      const strum=(ch,t,v,down)=>{ (down?ch:[...ch].reverse()).forEach((m,i)=>uke(N(m+12),t+i*.012,v)); };
      const knock=(t,v)=>{const s2=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s2.buffer=nb;f.type="bandpass";f.frequency.value=1800;f.Q.value=2;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s2.connect(f);f.connect(g);g.connect(out);s2.start(t);s2.stop(t+.05);};
      const PAT=[1,0,0,0, 1,0,1,0, 0,0,1,0, 1,0,1,0];   // 刷弦節奏：下 下上 上 下上
      for(let st=0;st<128;st++){
        const t=st*S16, bar=Math.floor(st/16), x=st%16, ch=CH[bar];
        if(x%2===0){const n=MEL[bar*8+x/2]; if(n){ let d=S16*2; let k=bar*8+x/2+1; while(k<(bar+1)*8 && !MEL[k]){ d+=S16*2; k++; } whistle(N(n),t,.07,Math.min(d,.9)); }}
        if(PAT[x]) strum(ch,t,.045,x%4===0);
        if(x===0||x===8) uke(N(ch[0]),t,.12);
        if(x===4||x===12) knock(t,.06);
      }
      oc.startRendering().then(buf=>{
        const d=buf.getChannelData(0), L=Math.floor(LOOP*sr);
        const loop=new Float32Array(L*2);                 // 尾音疊回開頭 → 無縫循環
        for(let i=0;i<L;i++){ const v=d[i]+(i+L<d.length?d[i+L]:0); loop[i]=v; loop[i+L]=v; }
        bgmEl=new Audio(); bgmEl.loop=true; bgmEl.preload="auto"; bgmEl.setAttribute("playsinline","");
        bgmEl.src=URL.createObjectURL(encodeWav(loop,sr));
        bgmReady=true;
        if(bgmWant) startBgm();
      }).catch(()=>{});
    }catch(e){}
  }
  prepareBgm();
  // 同時開好幾個（桌面 App＋瀏覽器分頁）時，只讓最後開始播的那個播
  const myId=Math.random().toString(36).slice(2);
  let bc=null; try{ bc=new BroadcastChannel("wd-bgm"); bc.onmessage=e=>{ if(e.data&&e.data.claim&&e.data.id!==myId) stopBgm(); }; }catch(e){}
  window.addEventListener("storage",e=>{ if(e.key==="wd_bgm_owner" && e.newValue && !e.newValue.startsWith(myId)) stopBgm(); });
  function claim(){ try{bc&&bc.postMessage({claim:1,id:myId});}catch(e){} try{localStorage.setItem("wd_bgm_owner",myId+":"+Date.now());}catch(e){} }
  function startBgm(){
    if(!bgmOn||document.hidden||updating) return;
    bgmWant=true;
    if(!bgmReady||bgmPlaying) return;
    const pr=bgmEl.play(); bgmPlaying=true; claim();
    if(pr&&pr.catch) pr.catch(()=>{ bgmPlaying=false; });
  }
  function stopBgm(){ bgmWant=false; bgmPlaying=false; if(bgmEl){ try{bgmEl.pause();}catch(e){} } }
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ stopBgm(); if(ctx&&ctx.suspend) ctx.suspend(); }
    else { if(ctx&&ctx.resume) ctx.resume().catch(()=>{}); if(bgmOn) startBgm(); }
  });
  window.addEventListener("pagehide",()=>{ stopBgm(); });
  return {
    init,
    play(name,...a){ if(!sfxOn) return; if(!init()) return; try{ sfx[name]&&sfx[name](...a); }catch(e){} },
    get sfxOn(){return sfxOn}, get bgmOn(){return bgmOn},
    _state(){ return {ctx: ctx?ctx.state:"none", playing: bgmPlaying && !!bgmEl && !bgmEl.paused, ready: bgmReady}; },
    setSfx(v){ sfxOn=v; store.set("wd_sfx",v); if(sfxBus){ sfxBus.gain.cancelScheduledValues(ctx.currentTime); sfxBus.gain.setValueAtTime(v?1:0,ctx.currentTime); } },
    setBgm(v){ bgmOn=v; store.set("wd_bgm",v); v?startBgm():stopBgm(); init(); },
  };
})();

/* ===== 吉祥物「叭叭車」：戳一下會叭叭叫、講話；連戳會引擎過熱冒煙 =====
   小狀態機：IDLE → HONK → IDLE；2.5 秒內戳 5 下 → HOT（冷卻 2 秒） */
const Car=(()=>{
  const btn=$("#carBtn"), g=$("#car"), bub=$("#bubble");
  function draw(face="normal"){
    const eyes = face==="happy" ? `<path d="M15 35q3-4 6 0M26 35q3-4 6 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`
      : face==="hot" ? `<path d="M14 33l6 4M20 33l-6 4M25 33l6 4M31 33l-6 4" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`
      : `<circle cx="18" cy="35" r="3" fill="${INK}"/><circle cx="29" cy="35" r="3" fill="${INK}"/><circle cx="19" cy="34" r="1" fill="#fff"/><circle cx="30" cy="34" r="1" fill="#fff"/>`;
    const mouth = face==="hot" ? `<path d="M19 43q4-3 8 0" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>` : `<path d="M19 41q4.5 5 9 0" fill="${face==="happy"?"#F2735A":"none"}" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    const smoke = face==="hot" ? `<g fill="#fff" stroke="${INK}" stroke-width="2"><circle cx="40" cy="6" r="5"/><circle cx="50" cy="2" r="6.5"/><circle cx="60" cy="6" r="4.5"/></g>` : "";
    g.innerHTML=`${smoke}
      <rect x="46" y="4" width="22" height="9" rx="2.5" fill="#E8D6B3" stroke="${INK}" stroke-width="2.4"/><path d="M57 4v9" stroke="${INK}" stroke-width="2"/>
      <path d="M22 26 L30 13 H70 L80 26 Z" fill="#FF7A59" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M33 24 L37 16 H50 V24 Z M54 24 V16 H67 L73 24 Z" fill="#BDE6FB" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="6" y="24" width="86" height="28" rx="12" fill="#FF7A59" stroke="${INK}" stroke-width="3"/>
      <rect x="8" y="38" width="7" height="6" rx="2" fill="#FFD54A" stroke="${INK}" stroke-width="2"/>
      <ellipse cx="14" cy="45" rx="4" ry="2.4" fill="#FFB7A6"/><ellipse cx="34" cy="45" rx="4" ry="2.4" fill="#FFB7A6"/>
      ${eyes}${mouth}
      <path d="M52 30v18" stroke="${INK}" stroke-width="2" opacity=".5"/>
      <g fill="${INK}"><circle cx="26" cy="54" r="9"/><circle cx="74" cy="54" r="9"/></g><g fill="#C9D8EA"><circle cx="26" cy="54" r="3.5"/><circle cx="74" cy="54" r="3.5"/></g>`;
  }
  const LINES=["叭叭！要去哪裡？","油加滿了，出發吧！","骰一下嘛～","帶阿公阿嬤一起去！","下雨也有地方去喔","記得帶水壺～","後車廂塞好了！","近的遠的我都可以"];
  let taps=[], bubT=0, busy=false;
  function say(t,ms=1600){ bub.textContent=t; bub.classList.add("show"); clearTimeout(bubT); bubT=setTimeout(()=>bub.classList.remove("show"),ms); }
  function poke(){
    if(busy) return;
    const now=Date.now(); taps=taps.filter(x=>now-x<2500); taps.push(now);
    if(taps.length>=5){
      busy=true; taps=[]; draw("hot"); btn.classList.remove("honk"); btn.classList.add("hot"); Snd.play("steam"); say("引擎過熱了啦～",1900);
      setTimeout(()=>{ btn.classList.remove("hot"); draw(); busy=false; },2000); return;
    }
    btn.classList.remove("honk"); void btn.offsetWidth; btn.classList.add("honk");
    Snd.play("honk"); draw("happy"); say(LINES[Math.floor(Math.random()*LINES.length)]);
    setTimeout(()=>{ if(!busy) draw(); },900);
  }
  function leave(){ btn.classList.remove("leave"); void btn.offsetWidth; btn.classList.add("leave"); Snd.play("vroom"); setTimeout(()=>btn.classList.remove("leave"),2700); }
  draw();
  btn.onclick=poke;
  return {say, leave};
})();

/* ===== 首頁 ===== */
function renderSigns(hit){
  $("#signs").classList.toggle("locked",!!mode);
  $("#signs").innerHTML=[1,2,3,4].map(k=>{
    const t=TIERS[k];
    return `<button class="sign ${mode===k?"on":""} ${hit===k?"won":""}" data-k="${k}">
      ${mode===k?`<span class="pin">指定</span>`:""}
      <span class="pl" style="background:${t.c}"><span class="in"><span class="ex">${t.faces.join("・")} 點</span><b>${t.name}</b><small>${t.range}</small></span></span></button>`;
  }).join("");
  $$("#signs .sign").forEach(b=>b.onclick=()=>{ if(rolling) return; const k=+b.dataset.k; mode = mode===k?0:k; store.set("wd_mode",mode); Snd.play("toggle",!!mode); renderHome(); });
  $("#signTip").textContent = mode ? "再點一次路牌，就交回給骰子決定" : "骰到幾點就去哪一區・點路牌可以直接指定";
}
function renderChips(){
  const list=TAGS.map(t=>[t.key,t.ic,t.label]).concat([["avoid","clock","避開 30 天內去過"]]);
  $("#chips").innerHTML=list.map(([k,ic,l])=>`<button class="ltag ${flt[k]?"on":""}" data-k="${k}">${ui(ic,19)}${l}</button>`).join("");
  $$("#chips .ltag").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; flt[k]=!flt[k]; store.set("wd_flt",flt); Snd.play("toggle",flt[k]); renderHome(); });
  $("#modeLine").innerHTML = mode
    ? `${ui("pin",18)}車程：指定「${TIERS[mode].name}」<button id="modeReset">交給骰子</button>`
    : `${ui("dice",18)}車程：交給骰子決定`;
  if(mode) $("#modeReset").onclick=()=>{ mode=0; store.set("wd_mode",0); Snd.play("toggle",false); renderHome(); };
}
function renderPool(){
  const n = mode ? poolOf(mode).length : [1,2,3,4].reduce((a,k)=>a+poolOf(k).length,0);
  $("#poolInfo").innerHTML = `${mode?TIERS[mode].name+"裡":"目前"}有 <b>${n}</b> 個地點可以骰`;
}
function renderHome(hit){ renderSigns(hit); renderChips(); renderPool(); }

function setDie(n){ faceNow=n; $("#die").innerHTML=dieSvg(n); }

/* ===== 骰！ ===== */
function roll(){
  if(rolling) return;
  const tiers = mode? [mode] : [1,2,3,4];
  const okT = tiers.filter(k=>poolOf(k).length>0);
  if(!okT.length){ Snd.play("oops"); toast(mode?"這一區沒有符合條件的地點，拿掉一些條件試試":"沒有符合條件的地點，拿掉一些條件試試"); shake(); return; }
  const faces = okT.flatMap(k=>TIERS[k].faces);
  const face = faces[Math.floor(Math.random()*faces.length)];
  const tier = faceTier(face);
  let pool = poolOf(tier); if(pool.length>1) pool=pool.filter(s=>s.id!==lastId);
  const spot = pool[Math.floor(Math.random()*pool.length)];
  lastId = spot.id;

  rolling=true; $("#rollBtn").disabled=true; renderSigns();
  const wrap=$("#dieWrap"), sh=$("#dieShadow");
  $("#dieIdle").style.animation="none";
  // 骰子往上拋、翻滾、在路上彈兩下（只用 transform，桌面 App 也順）
  const A=wrap.animate([
    {transform:"translate(0,0) rotate(0)"},
    {transform:"translate(-40px,-150px) rotate(-260deg)",offset:.28},
    {transform:"translate(-10px,0) rotate(-520deg) scale(1.08,.9)",offset:.5},

/* 紙花：小星星、小骰子、小旗子 */
function confetti(){
  const box=$("#confetti"), cols=["#FFD54A","#FF7A59","#8FCF6B","#9AD3F7","#8A6BD1","#fff"];
  const shapes=[c=>`<path d="M12 2l2.5 7H22l-6 4.5 2.3 7.5L12 16.5 5.7 21 8 13.5 2 9h7.5z" fill="${c}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`,
    c=>`<rect x="4" y="4" width="16" height="16" rx="4" fill="${c}" stroke="${INK}" stroke-width="1.6"/><circle cx="9" cy="9" r="1.6" fill="${INK}"/><circle cx="15" cy="15" r="1.6" fill="${INK}"/>`,
    c=>`<path d="M5 21V3" stroke="${INK}" stroke-width="1.8"/><path d="M5 3.5h12l-3 4 3 4H5z" fill="${c}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`];
  let h="";
  for(let i=0;i<28;i++){
    const c=cols[i%cols.length], s=14+Math.random()*12;
    h+=`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="--x:${Math.random()*100}vw;--dx:${(Math.random()-.5)*120}px;--r:${(Math.random()-.5)*720}deg;--d:${1.3+Math.random()*.9}s;--dl:${Math.random()*.3}s">${shapes[i%3](c)}</svg>`;
  }
  box.innerHTML=h; setTimeout(()=>{ box.innerHTML=""; },2600);
}

/* ===== 新增／編輯地點 ===== */
function editSpot(id){
  const s = id ? spots().find(x=>x.id===id) : {id:null,name:"",area:"",min:30,tags:[],note:"",off:false};
  if(!s) return;
  const f={...s,tags:[...s.tags]};
  const isBase = !!f.id && f.id.startsWith("b:");
  openSheet(`<div class="sheetBody form">
    <h2>${id?"編輯地點":"新增地點"}</h2>
    <label>名稱</label><input type="text" id="fName" maxlength="40" value="${esc(f.name)}" placeholder="例如：南寮漁港">
    <label>地區</label><input type="text" id="fArea" maxlength="20" value="${esc(f.area)}" placeholder="例如：新竹市">
    <label>從家裡開車大約幾分鐘</label>
    <div class="minRow"><button id="mMinus">−</button><output id="fMin"></output><button id="mPlus">＋</button><span class="tl" id="fTier"></span></div>
    <label>貼上標籤</label><div class="tags" id="fTags"></div>
    <label>一句話備註</label><textarea id="fNote" maxlength="80" placeholder="例如：有大草皮、記得帶防曬">${esc(f.note||"")}</textarea>
    <div class="sw"><span class="t">${ui("eyeoff",20)}先不要骰到這裡</span><button id="fOff" class="${f.off?"on":""}" aria-label="不要骰到"></button></div>
    <div class="formActs">
      ${id?`<button class="btn danger" id="fDel">刪除</button>`:""}
      <button class="btn green" id="fSave">${ui("check",20)}儲存</button>
    </div>
  </div>`);
  const paintMin=()=>{ const t=TIERS[tierOf(f.min)]; $("#fMin").textContent=f.min+" 分"; $("#fTier").textContent=t.name; $("#fTier").style.background=t.c; };
  const paintTags=()=>{ $("#fTags").innerHTML=TAGS.map(t=>`<button class="ltag ${f.tags.includes(t.ch)?"on":""}" data-ch="${t.ch}">${ui(t.ic,19)}${t.label}</button>`).join("");
    $$("#fTags .ltag").forEach(b=>b.onclick=()=>{ const c=b.dataset.ch; f.tags=f.tags.includes(c)?f.tags.filter(x=>x!==c):f.tags.concat(c); Snd.play("toggle",f.tags.includes(c)); paintTags(); }); };
  paintMin(); paintTags();
  const step=d=>{ f.min=Math.max(5,Math.min(300,f.min+d)); Snd.play("pop"); paintMin(); };
  $("#mMinus").onclick=()=>step(-5); $("#mPlus").onclick=()=>step(5);
  $("#fOff").onclick=e=>{ f.off=!f.off; e.currentTarget.classList.toggle("on",f.off); Snd.play("toggle",!f.off); };
  $("#fSave").onclick=()=>{
    f.name=$("#fName").value.trim(); f.area=$("#fArea").value.trim(); f.note=$("#fNote").value.trim();
    if(!f.name){ toast("名稱要填喔"); $("#fName").focus(); return; }
    const out={name:f.name,area:f.area,min:f.min,tags:f.tags,note:f.note,off:f.off};
    if(!id){ data.added.push(Object.assign({id:"u:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},out)); toast("新增好了！"); }
    else if(isBase){ data.edits[id]=out; toast("改好了！"); }
    else { const i=data.added.findIndex(x=>x.id===id); if(i>=0) data.added[i]=Object.assign({id},out); toast("改好了！"); }
    saveData(); Snd.play("tada"); closeSheet(); renderAll();
  };
  if(id){
    let armed=false;
    $("#fDel").onclick=e=>{
      if(!armed){ armed=true; e.currentTarget.classList.add("armed"); e.currentTarget.textContent="再按一次刪除"; Snd.play("oops"); return; }
      if(isBase){ data.deleted.push(id); delete data.edits[id]; } else data.added=data.added.filter(x=>x.id!==id);
      saveData(); toast("刪掉了"); closeSheet(); renderAll();
    };
  }
}

/* ===== 自動檢查更新（像 FW 的 OTA：問伺服器 version.json，比手上新就重新載入） ===== */
async function checkUpdate(){
  if(updating || !/github\.io$/.test(location.hostname)) return;
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(verNum(j.version)>verNum(APP_VERSION)){
      updating=true;
      const go=()=>location.replace(location.pathname+"?v="+j.version);
      if(document.body.classList.contains("booting")) go();
      else if(!rolling && !sheetOpen()){ toast("有新版本 v"+j.version+"，更新中…"); setTimeout(go,900); }
      else { toast("有新版本 v"+j.version+"，關掉視窗後自動更新"); const t=setInterval(()=>{ if(!rolling && !sheetOpen()){ clearInterval(t); go(); } },1000); }
    }
  }catch(e){}
}

  const centerTitle=()=>{ tt.style.left=Math.round((window.innerWidth-tt.getBoundingClientRect().width)/2)+"px"; };
  centerTitle();
  setTimeout(()=>sp.classList.add("sp-live"),150);   // 前 0.15 秒跟 iPhone 啟動圖一樣：只有天空底色
  let out=false;
  function exit(){
    if(out) return; out=true;
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finish=()=>{ sp.remove(); document.body.classList.remove("sp-flying"); setTimeout(()=>document.body.classList.remove("enter"),1000); splashDoneR(); };
    document.body.classList.remove("booting");
    if(reduce){ document.body.classList.add("enter"); sp.classList.add("sp-fade"); setTimeout(finish,520); return; }
    window.scrollTo(0,0);
    document.body.classList.add("sp-flying","enter");
    // FLIP：先量起點（開機畫面）和終點（首頁），再用 transform 補間過去
    const fly=(el,target,scale)=>{
      const a=el.getBoundingClientRect(), b=target.getBoundingClientRect();
      const sc=scale?b.width/a.width:1;
      el.style.transition="transform .75s cubic-bezier(.6,0,.15,1)";
      el.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${sc})`;
    };
    centerTitle();
    tt.querySelectorAll("span").forEach(s=>{ s.style.animation="none"; s.style.opacity="1"; });
    $("#spDrop").style.animation="none"; $("#spDrop").style.opacity="1";
    requestAnimationFrame(()=>{
      fly($("#spDie"),$("#dieWrap"),false);
      fly(tt,$("#h1t"),true);
      sp.classList.add("sp-exit");
      setTimeout(finish,800);
    });
  }
  const t0=performance.now();
  const fontsOk=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(), new Promise(r=>setTimeout(r,1200))]);
  fontsOk.then(()=>{ centerTitle(); const wait=Math.max(0,2400-(performance.now()-t0)); setTimeout(exit,wait); });
  setTimeout(exit,4000);   // 保險：最多 4 秒
})();
</script>
</body>
