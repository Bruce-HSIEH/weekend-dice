<title>假日骰骰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* ===== 公路旅行明信片風 ===== */
:root{
  --ink:#2B3A55; --ink2:#6B7A93; --line:#D6E3F0;
  --sky1:#8FD0F5; --sky2:#C4E9FC; --sky3:#EAF7FF;
  --grass:#8FCF6B; --grass-d:#5FAF4A; --road:#5B6170; --lane:#FFD54A;
  --sun:#FFD54A; --coral:#FF7A59; --paper:#FFFBF1; --kraft:#E8D6B3;
  --t1:#3DAA6E; --t2:#3B8EDB; --t3:#F29A3A; --t4:#8A6BD1;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);background:#F2F8FD;
  font-family:"Huninn","jf-openhuninn","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;}
html.lock,html.lock body{overflow:hidden;touch-action:none}
body{overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 28px);
  background-image:linear-gradient(rgba(59,142,219,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,142,219,.06) 1px,transparent 1px);background-size:26px 26px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea{font-family:inherit;color:var(--ink)}
svg.ic{display:inline-block;vertical-align:middle;flex:none}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto}
.pad{padding:0 16px}

/* ---------- 上方天空標題列 ---------- */
.top{position:relative;padding:calc(env(safe-area-inset-top) + 14px) 14px 54px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 65%,var(--sky3) 100%)}
.top .cloud{position:absolute;opacity:.95}
.top .cloud.c1{top:calc(env(safe-area-inset-top) + 58px);left:-20%;animation:drift 40s linear infinite}
.top .cloud.c2{top:calc(env(safe-area-inset-top) + 20px);left:-20%;animation:drift 58s linear -25s infinite;opacity:.8}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(140vw)}}
.topbar{position:relative;z-index:2;display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:28px;font-weight:400;letter-spacing:.05em;line-height:1.2;white-space:nowrap;color:var(--ink);
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff}
#h1t{display:inline-block;line-height:1.2}
.sub{font-size:13px;color:var(--ink);margin-top:3px;white-space:nowrap;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.ver{display:inline-block;vertical-align:middle;margin-left:4px;border:2px solid var(--ink);background:var(--sun);border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;text-shadow:none;letter-spacing:0}
.snd{display:flex;gap:6px}
.snd button{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink);transition:.15s}
.snd button.off{background:#E3EAF2;opacity:.75}
.snd button.off svg{opacity:.45}
.snd button:active{transform:translateY(3px);box-shadow:none}
.vanBtn{flex:none;width:70px;height:51px;border:0;background:none;padding:0;margin:-2px 2px 0 -4px}
.vanBtn svg{width:70px;height:51px;display:block;overflow:visible}
.carBody{animation:carIdle .45s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes carIdle{to{transform:translateY(-1.2px)}}
.vanBtn.honk .carBody{animation:honk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes honk{0%{transform:scale(1.1,.86)}45%{transform:scale(.95,1.08) translateY(-6px)}100%{transform:none}}
.vanBtn.hot .carBody{animation:hot .1s linear infinite}
@keyframes hot{50%{transform:translateX(2px) rotate(1.5deg)}}
.bubble{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:6;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:4px 11px;font-size:14px;white-space:nowrap;
  opacity:0;transform:scale(.4) translateY(-8px);transform-origin:20px 0;transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.bubble::before{content:"";position:absolute;left:22px;top:-11px;border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;left:23.5px;top:-7px;border:5.5px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble.show{opacity:1;transform:none}

/* ---------- 台灣地圖 ---------- */
.mapCard{position:relative;margin:-40px 14px 0;height:200px;transition:height .45s cubic-bezier(.3,1.2,.5,1);background:#CDEAF9;background-image:radial-gradient(rgba(255,255,255,.55) 1.5px,transparent 1.5px);background-size:16px 16px;border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;
  box-shadow:4px 5px 0 rgba(43,58,85,.2);z-index:3}
.mapCard>svg{display:block;width:100%;height:100%}
.mapCard .county{transition:fill .45s ease}
.mapCard .tag{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 6px;font-size:13px;pointer-events:none;max-width:58%;white-space:nowrap}
.mapCard #fromTag{pointer-events:auto;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mapCard #fromTag .chg{font-size:11px;color:var(--ink2);text-decoration:underline;margin-left:2px}
.mapCard.noOrigin #fromTag{background:var(--coral);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.mapCard.noOrigin #fromTag .chg{color:#fff}
@keyframes pulse{50%{transform:scale(1.06)}}
.mapCard.tapping{cursor:crosshair;box-shadow:0 0 0 4px var(--coral),4px 5px 0 rgba(43,58,85,.2)}
.mapCard.tapping::after{content:"點一下地圖，選出發地點";position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap;pointer-events:none}
.mapCard .reachTag{left:auto;right:10px;background:var(--sun)}
.mapCard .reachTag b{font-weight:400}
.dot{transition:fill .25s}
.mapCard.picking .dot.on{fill:#FFC7B8}
.dot.flash{fill:var(--sun)!important}

/* ---------- 控制面板 ---------- */
.panel{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:14px 14px 16px;margin:16px 14px 0;box-shadow:4px 5px 0 rgba(43,58,85,.18)}
.panel h3{margin:0 0 8px;font-weight:400;font-size:16px;display:flex;align-items:center;gap:6px}
.panel h3 small{margin-left:auto;font-size:11px;color:var(--ink2)}
.panel .sec+.sec{margin-top:14px;padding-top:12px;border-top:2px dashed var(--kraft)}
.reachRow{display:flex;gap:8px;align-items:stretch}
.seg{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:7px 0 6px;font-size:13px;line-height:1.15;white-space:nowrap;transition:.15s}
.seg button small{display:block;font-size:10px;color:var(--ink2)}
.seg button.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.dirSeg{grid-template-columns:repeat(5,1fr)}
.dirSeg button{display:flex;flex-direction:column;align-items:center;gap:2px}
.dirSeg button.on{background:#FFD3C6}
.rndBtn{flex:none;width:58px;border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;box-shadow:0 3px 0 var(--ink)}
.rndBtn svg{width:34px;height:34px;display:block;overflow:visible}
.rndBtn:active{transform:translateY(3px);box-shadow:none}
.rndBtn.spin svg{animation:rndSpin .5s linear infinite}
@keyframes rndSpin{to{transform:rotate(360deg)}}
.farRow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.farRow .t{flex:1;color:var(--ink)}
.farRow .t small{display:block;font-size:11px;color:var(--ink2)}
.sw2{flex:none;width:48px;height:28px;border-radius:999px;border:2.5px solid var(--ink);background:#E3EAF2;position:relative;padding:0;transition:.2s}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .2s}
.sw2.on{background:var(--coral)}
.sw2.on::after{transform:translateX(20px)}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px}
.goRow{margin:14px 14px 0;text-align:center}
.goBtn{width:100%;border:3px solid var(--ink);border-radius:999px;background:var(--sun);font-size:21px;padding:13px 10px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 var(--ink);letter-spacing:.04em}
.goBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.goBtn:disabled{opacity:.7}
.goBtn svg{width:46px;height:34px;overflow:visible}
.pool{display:block;width:100%;border:0;background:none;text-align:center;font-size:13px;color:var(--ink2);margin-top:8px;padding:4px}
.pool .more{color:var(--ink);text-decoration:underline;margin-left:4px}
.poolList{margin-top:6px;max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:6px;text-align:left}
.poolList .pl{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:2px dashed var(--kraft);background:none;padding:7px 4px;text-align:left}
.poolList .pl:last-child{border-bottom:0}
.poolList .m{flex:none;width:40px;height:34px;border-radius:9px;border:2px solid var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.poolList .m small{font-size:9px;display:block}
.poolList .tx{flex:1;min-width:0}
.poolList .tx b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poolList .tx small{display:block;font-size:11px;color:var(--ink2)}
.poolList .tg{flex:none;display:flex;gap:1px}
.pool b{color:var(--ink);font-weight:400;background:#fff;border:2px solid var(--line);border-radius:8px;padding:0 6px}


/* 條件按鈕：前面是勾選圓圈 */
.ltag.ltag{padding:6px 12px 6px 7px}
.ltag.ltag::before{display:none}
.ltag .ck{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center}
.ltag.on .ck{background:var(--ink)}
.ltag.ltag.on{background:#C8EBB2;transform:none}
.ltag.ltag.on:nth-child(2n){transform:none}

.chipGrp+.chipGrp{margin-top:12px}
.chipTitle{font-size:12.5px;color:#7A869A;margin:0 0 6px 2px;letter-spacing:.05em}
.tg .more{font-size:11px;font-weight:700;color:#7A869A;margin-left:1px}

/* ===== 小地圖 ↔ 大地圖 ===== */
.mapCard.big{height:min(440px,56vh);min-height:340px}
.mapCard:not(.big) #labels{display:none}
.mapCard:not(.big) .tag{font-size:12px;padding:1px 8px 1px 5px}
.zoomBtn{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0}
.zoomBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
/* 幫我挑一個：固定在下方導覽列上面，選條件時隨時按得到 */
.goRow{position:sticky;bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 18px);z-index:30;margin:12px 14px 0;padding:6px 8px 8px;background:rgba(244,248,251,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:26px}
.goRow .pool{margin:0 0 6px}
.goBtn{padding:10px 10px;font-size:19px}
.goBtn svg{width:40px;height:30px}
#poolList{margin:12px 14px 0}
/* 條件按鈕縮小一點，畫面比較集中 */
.panel{padding:12px 12px 14px;margin-top:12px}
.panel .sec+.sec{margin-top:10px;padding-top:9px}
.panel h3{font-size:15px;margin-bottom:6px}
.seg button{padding:5px 0 4px;font-size:12.5px}
#chips .tags{gap:6px 6px}
.ltag.ltag{padding:3px 9px 3px 5px;font-size:13.5px;gap:4px;border-width:2px}
.ltag .ck{width:16px;height:16px}
.ltag .ck svg{width:10px;height:10px}
.ltag svg.ic{width:16px;height:16px}
.chipGrp+.chipGrp{margin-top:8px}
.chipTitle{font-size:11.5px;margin-bottom:4px}
.hint{margin-top:5px}
body #toast{bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 128px)}
.mapCard{height:180px}
.dirSeg button small{display:none}
.dirSeg button{flex-direction:row;justify-content:center;gap:2px;padding:6px 0}
.dirSeg button svg{width:16px;height:16px}
.farRow{margin-top:7px}
.panel .hint{display:none}
/* ---------- 行前檢查（條件） ---------- */
.board{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:26px 16px 16px;margin:24px 16px 0;box-shadow:5px 6px 0 rgba(43,58,85,.18)}
.board .clip{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:96px;height:30px}
.board h3{margin:0 0 4px;font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.board .note2{font-size:12px;color:var(--ink2);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:10px 8px}
.ltag{position:relative;border:2.5px solid var(--ink);background:#fff;border-radius:6px 14px 14px 6px;padding:6px 12px 6px 22px;font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:.15s}
.ltag::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;border:2px solid var(--ink);background:#F2F8FD}
.ltag.on{background:var(--grass);transform:rotate(-2deg)}
.ltag.on:nth-child(2n){transform:rotate(2deg)}
.modeLine{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--kraft);font-size:13px}
.modeLine button{margin-left:auto;border:2px solid var(--ink);background:#fff;border-radius:999px;font-size:12px;padding:3px 10px}

/* ---------- 名單（票根） ---------- */
.pageHead{padding:calc(env(safe-area-inset-top) + 16px) 16px 10px;background:linear-gradient(180deg,var(--sky2),rgba(234,247,255,0));}
.pageHead h2{margin:0;font-weight:400;font-size:26px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pageHead h2 small{font-size:13px;color:var(--ink2);margin-left:auto}
.search{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:0 14px;margin-top:12px}
.search input{flex:1;border:0;outline:0;font-size:16px;padding:10px 0;background:none;min-width:0}
.tierTabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none}
.tierTabs::-webkit-scrollbar{display:none}
.tierTabs button{flex:none;border:2.5px solid var(--ink);background:#fff;border-radius:9px;padding:4px 10px;font-size:13px;white-space:nowrap}
.tierTabs button.on{color:#fff}
.grpH{display:flex;align-items:center;gap:8px;font-size:16px;margin:16px 16px 8px}
.grpH i{display:inline-block;border-radius:6px;border:2px solid var(--ink);color:#fff;font-style:normal;font-size:12px;padding:0 7px;line-height:20px}
.grpH small{color:var(--ink2);font-size:12px}
.tk{display:flex;width:calc(100% - 32px);margin:0 16px 10px;padding:0;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);text-align:left;position:relative;box-shadow:0 3px 0 rgba(43,58,85,.2)}
.tk:active{transform:scale(.98)}
.tk .stub{flex:none;width:62px;color:#fff;border-radius:11px 0 0 11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;border-right:2.5px dashed rgba(255,255,255,.95)}
.tk .stub small{font-size:10px;margin-top:2px}
.tk::before,.tk::after{content:"";position:absolute;left:53px;width:14px;height:14px;border-radius:50%;background:#F2F8FD;border:2.5px solid var(--ink)}
.tk::before{top:-9px;clip-path:inset(50% 0 0 0)} .tk::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.tk .tx{flex:1;min-width:0;padding:9px 10px 9px 14px}
.tk .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .ar{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tk .tg{display:flex;gap:2px;align-items:center;padding-right:10px;flex:none}
.tk.off{opacity:.5}
.badge{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px;background:var(--sun);border:1.5px solid var(--ink);line-height:15px}
.badge.gray{background:#E3EAF2}
.empty{text-align:center;color:var(--ink2);padding:30px 16px;line-height:1.7}
.fab{position:fixed;right:calc(50% - min(50vw,260px) + 18px);bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 26px);z-index:40;width:60px;height:60px;border-radius:50%;
  border:3px solid var(--ink);background:var(--sun);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:0}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ---------- 足跡 ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 16px 0}
.stat{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(43,58,85,.2)}
.stat b{display:block;font-weight:400;font-size:30px;line-height:1.1}
.stat small{font-size:12px;color:var(--ink2)}
.trail{position:relative;margin:18px 16px 0;padding-left:26px}
.trail::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(180deg,var(--ink2) 0 8px,transparent 8px 14px);border-radius:2px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 26px);z-index:300;background:#fff;color:var(--ink);border:2.5px solid var(--ink);font-size:14px;padding:8px 16px;border-radius:999px;
  transform:translate(-50%,16px);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 var(--ink)}
#toast.show{transform:translate(-50%,0);opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
#confetti svg{position:absolute;left:var(--x);top:-30px;animation:fall var(--d) cubic-bezier(.25,.6,.4,1) var(--dl) both}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- 開機畫面：天空 → 台灣浮出來 → 從家裡一圈圈擴散 → 字跳出 → 標題飛到首頁 ---------- */
#splash{position:fixed;inset:0;z-index:200;overflow:hidden;pointer-events:none}
#splash .sp-bg{position:absolute;inset:0;background:linear-gradient(180deg,#8FD0F5 0%,#C4E9FC 55%,#EAF7FF 100%);transition:opacity .5s ease}
#splash .sp-map{position:absolute;left:50%;top:9%;width:210px;height:378px;margin-left:-105px;opacity:0}
#splash .sp-map svg{width:100%;height:100%;display:block;overflow:visible}
#splash.sp-live .sp-map{animation:spMap .7s cubic-bezier(.2,1.3,.4,1) .05s both}
@keyframes spMap{0%{opacity:0;transform:translateY(30px) scale(.8)}100%{opacity:1;transform:none}}
#splash .sp-ring{fill:#FFD54A;fill-opacity:.25;stroke:var(--coral);stroke-width:7;opacity:0}
#splash.sp-live .sp-ring{animation:spRing 1.6s ease-out infinite}
#splash.sp-live .sp-ring.r2{animation-delay:.55s}
#splash.sp-live .sp-ring.r3{animation-delay:1.1s}
@keyframes spRing{0%{opacity:.9;transform:scale(.1)}100%{opacity:0;transform:scale(1)}}
#splash .sp-title{position:absolute;left:0;top:calc(9% + 392px);font-size:40px;letter-spacing:.05em;line-height:1.2;color:var(--ink);white-space:nowrap;transform-origin:0 0;display:inline-block;
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff}
#splash .sp-title span{display:inline-block;opacity:0}
#splash.sp-live .sp-title span{animation:spLetter .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.75s + var(--i) * 110ms)}
@keyframes spLetter{0%{opacity:0;transform:translateY(18px) rotate(-10deg) scale(.4)}100%{opacity:1;transform:none}}
#splash .sp-tag{position:absolute;left:0;right:0;top:calc(9% + 448px);text-align:center;font-size:16px;color:var(--ink2);opacity:0}
#splash.sp-live .sp-tag{animation:spTag .6s ease 1.35s both}
@keyframes spTag{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
#splash.sp-exit .sp-bg,#splash.sp-exit .sp-tag,#splash.sp-exit .sp-map{opacity:0!important;transition:opacity .45s ease;animation:none}
#splash.sp-fade{opacity:0;transition:opacity .5s ease}
@media (max-height:700px){#splash .sp-map{top:5%;width:170px;height:306px;margin-left:-85px}#splash .sp-title{top:calc(5% + 318px)}#splash .sp-tag{top:calc(5% + 372px)}}
body.booting .app,body.booting .nav{opacity:0}
body.sp-flying #h1t{visibility:hidden}
body.enter .mapCard,body.enter .panel,body.enter .goRow,body.enter .snd,body.enter .vanBtn,body.enter .sub,body.enter .ver{animation:rise .55s cubic-bezier(.2,1.3,.4,1) both}

body.enter .mapCard{animation-delay:.05s} body.enter .goRow{animation-delay:.15s} body.enter .panel{animation-delay:.25s}
body.enter .vanBtn{animation:vanIn .9s cubic-bezier(.2,1.1,.4,1) .1s both}

@keyframes rise{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes navUp{0%{opacity:0;transform:translate(-50%,40px)}100%{opacity:1;transform:translate(-50%,0)}}

/* ===== 主題：成熟一點的可愛（薄荷綠＋珊瑚，暖白底） ===== */
:root{
  --ink:#2B3A55; --ink2:#738096; --line:#E3DED4;
  --sun:#9EDFD3;           /* 原本的黃色 → 淡薄荷：選中、標籤 */
  --pri:#2E9E92;           /* 主色：深一點的薄荷綠 */
  --pri-d:#21796F;
  --coral:#F27D62; --paper:#FFFDF9; --kraft:#E8DFD0;
  --sky1:#BFE6E0; --sky2:#DDF1EC; --sky3:#F6F3EE;
}
html,body{background:#F6F3EE}
body{background-image:radial-gradient(rgba(43,58,85,.07) 1.2px,transparent 1.2px);background-size:22px 22px}
.top{background:linear-gradient(180deg,#BFE6E0 0%,#DDF1EC 60%,#F6F3EE 100%)}

/* 地圖 */
.mapCard{background:#D7ECF2;border-color:var(--ink)}
.mapCard .reachTag{background:#fff}
.mapCard .reachTag b{color:var(--pri-d)}

/* 卡片 */
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 rgba(43,58,85,.12);padding:14px 14px 14px}
.panel h3{font-size:15.5px;margin:0 0 9px;color:var(--ink)}
.panel h3 small{color:var(--ink2)}
.panel .sec+.sec{margin-top:14px;padding-top:13px;border-top:1.5px dashed var(--kraft)}

/* 開多遠：一排膠囊 */
.reachRow{display:flex;gap:6px;align-items:stretch}
.seg{gap:5px}
.seg button{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px 0 5px;font-size:13px;box-shadow:none;transform:none}
.seg button small{font-size:9.5px}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.seg button.on small{color:#E2F6F2}
.rndBtn{flex:none;width:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.rndBtn svg{width:30px;height:30px}
/* 方向：小一號，跟開多遠疊在一起 */
.dirSeg{margin-top:8px}
.dirSeg button{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:3px;padding:5px 0;font-size:12.5px}
.dirSeg button.on{background:#E3F5F1;color:var(--ink);box-shadow:0 3px 0 var(--ink)}

/* 情境卡：3×2 */
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scene{position:relative;border:2px solid var(--ink);border-radius:16px;background:#fff;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .15s,background .15s}
.scene .si{width:44px;height:44px;border-radius:50%;background:#F1EEE7;display:grid;place-items:center;margin-bottom:3px;transition:background .15s}
.scene b{font-weight:400;font-size:14px;white-space:nowrap}
.scene small{font-size:9.5px;color:var(--ink2);white-space:nowrap}
.scene i{position:absolute;top:5px;right:6px;font-style:normal;font-size:10px;color:var(--ink2);background:#F1EEE7;border-radius:999px;padding:0 6px;line-height:16px}
.scene:active{transform:scale(.96)}
.scene.on{background:#E3F5F1;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.scene.on .si{background:#fff;box-shadow:0 0 0 2.5px var(--pri)}
.scene.on i{background:var(--pri);color:#fff}

/* 講究一下：摘要＋按鈕 */
.condSum{display:flex;flex-direction:column;gap:8px}
.sumTags{display:flex;flex-wrap:wrap;gap:6px}
.sumTag{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;background:#E3F5F1;padding:2px 6px 2px 8px;font-size:13px}
.sumTag .x{margin-left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;line-height:1}
.sumNone{font-size:13px;color:var(--ink2)}
.addCond{display:flex;align-items:center;gap:6px;border:2px dashed var(--ink2);border-radius:14px;background:none;padding:9px 12px;font-size:14px;width:100%}
.addCond small{margin-left:auto;font-size:11px;color:var(--ink2)}

/* 條件 sheet */
.condSheet .chipGrp{margin-top:14px}
.condSheet .chipTitle{font-size:12px;color:var(--ink2);margin-bottom:6px}
.condSheet .tags{display:flex;flex-wrap:wrap;gap:7px}
.condSheet .ltag.ltag{padding:4px 11px 4px 6px;font-size:14px;gap:5px;border-width:2px;background:#fff;transform:none}
.condSheet .ltag.ltag.on{background:#E3F5F1}
.ltag .ck{width:17px;height:17px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:#fff;flex:none}
.ltag.on .ck{background:var(--pri);border-color:var(--pri-d)}
.condFoot{position:sticky;bottom:-1px;display:flex;gap:8px;margin-top:18px;padding:10px 0 4px;background:var(--paper)}
.condFoot .btn{flex:none}
.condFoot #condDone{flex:1}

/* 主按鈕：薄荷綠＋白字 */
.goRow{background:rgba(246,243,238,.92)}
.goBtn{background:var(--pri);color:#fff;border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:19px;padding:10px}
.goBtn:active{box-shadow:0 1px 0 var(--ink)}
.pool b{border-color:var(--line)}
.btn.yellow{background:var(--pri);color:#fff}
.nav button.on{background:var(--sun)}
.ver{background:#fff}
.scene.zero:not(.on){opacity:.45}
/* 跑馬燈：亮起的縣市 */
.mapCard .county.lit{fill:#FF9F80!important;opacity:1!important;transition:none!important}
.mapCard.picking .county:not(.lit){opacity:.45}
.mapCard .county{transition:fill .45s ease,opacity .2s}
.mapCard.picking .county{transition:fill .25s ease,opacity .2s}
.mapCard .county.lit+.county{}

</style>
</head>

/* ===== 實心手繪骰子（圓角正面＋往右上擠出的厚度，全部不透明） ===== */
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],
  5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[29,24],[29,50],[29,76],[71,24],[71,50],[71,76]]};
const pipSet=(n,r)=>PIPS[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${n===1?r*1.45:r}" fill="${n===1?"#F2735A":INK}"/>`).join("");
// 圓角方塊往右上「擠出」厚度：同一個圓角形狀疊 10 層，所有邊角一樣圓
let dieUid=0;
function dieSvg(n){
  const id="dg"+(++dieUid);   // SVG 漸層 id 要唯一，避免多顆骰子互相蓋掉
  const X=12,Y=30,S=84,R=24,DX=13,DY=-13,K=10;
  const layers=[]; for(let i=K;i>=1;i--) layers.push([DX*i/K,DY*i/K]);
  const rect=(dx,dy,extra)=>`<rect x="${X+dx}" y="${Y+dy}" width="${S}" height="${S}" rx="${R}" ${extra}/>`;
  const pip=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-r*.32}" cy="${y-r*.34}" r="${r*.3}" fill="#fff" opacity=".5"/>`;
  const pips=PIPS[n].map(([x,y])=>{ const px=X+8+x*.68, py=Y+8+y*.68; return n===1?pip(px,py,13,"#F2735A"):pip(px,py,7.6,INK); }).join("");
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF4FB"/><stop offset="1" stop-color="#B9CCE3"/></linearGradient></defs>
    ${layers.map(([dx,dy])=>rect(dx,dy,`fill="${INK}" stroke="${INK}" stroke-width="10"`)).join("")}
    ${layers.map(([dx,dy])=>rect(dx,dy,`fill="url(#${id})"`)).join("")}
    ${rect(0,0,`fill="#fff" stroke="${INK}" stroke-width="5"`)}
    <path d="M${X+14} ${Y+R*.9} Q${X+14} ${Y+12} ${X+R+10} ${Y+11}" fill="none" stroke="#E3ECF7" stroke-width="5" stroke-linecap="round"/>
    ${pips}`;
}
function faceMini(n,s=18,bg="#fff"){
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="20" fill="${bg}" stroke="${INK}" stroke-width="8"/>${pipSet(n,9)}</svg>`;
}

/* ===== 地點資料：內建名單＋使用者改的（像 FW 的 default table + NVM 覆寫） ===== */
const BASE = BASE_RAW.map(([name,area,min,tg,note,lat,lng])=>({id:"b:"+name,name,area,min,tags:[...tg],note,off:false,lat,lng}));
function spots(){
  const del=new Set(data.deleted);
  return BASE.filter(s=>!del.has(s.id)).map(s=>data.edits[s.id]?Object.assign({},s,data.edits[s.id]):s).concat(data.added.map(s=>({...s,manual:true})))
    .map(s=>{ const m=minFrom(s); return m===s.min ? s : {...s, min:m, baseMin:s.min}; });
}
const saveData=()=>store.set("wd_data",data);
const visitedRecently = id=>hist.some(h=>h.id===id && Date.now()-h.t < 30*864e5);
const lastVisit = id=>hist.filter(h=>h.id===id).reduce((a,h)=>Math.max(a,h.t),0);
function bearingOf(lat,lng){
  const o=origin||REF, dx=(lng-o.lng)*Math.cos(o.lat*D2R), dy=lat-o.lat;
  return (Math.atan2(dx,dy)/D2R+360)%360;
}
function dirOf(s){
  if(s.dir) return s.dir;
  if(s.lat==null) return "near";
  const b=bearingOf(s.lat,s.lng);
  for(const k of ["N","E","S","W"]){ const d=DIRS[k]; if(d.from<d.to ? (b>=d.from&&b<d.to) : (b>=d.from||b<d.to)) return k; }
  return "N";
}
const dirName=d=>d==="near"?"附近":DIRS[d].name;
function reachRange(){
  const R=REACHES[reachIdx], max=R.m||9999;
  const last=REACHES.length-1;
  const min = far ? (reachIdx===0?15 : reachIdx===last?REACHES[last-1].m : REACHES[reachIdx-1].m) : 0;
  return {min,max};
}
function passesTags(s){
  if(s.off) return false;
  for(const t of TAGS) if(t.g!=="ex" && flt[t.key] && !s.tags.includes(t.ch)) return false;
  if(flt.noresv && s.tags.includes("約")) return false;
  if(scene && SCENES[scene] && !SCENES[scene].any.some(ch=>s.tags.includes(ch))) return false;
  if(flt.avoid && visitedRecently(s.id)) return false;
  return true;
}
function isCandidate(s){
  if(!passesTags(s)) return false;
  const {min,max}=reachRange();
  if(s.min>max || s.min<min) return false;
  if(dir!=="all" && s.min>20 && dirOf(s)!==dir) return false;
  if(!origin) return true;   // 20 分鐘內的附近地點不分方向
  return true;
}
const candidates=()=>spots().filter(isCandidate);

/* ===== 音效 & 背景音樂 ===== */
const Snd = (()=>{
  let ctx=null, sfxBus=null;
  let sfxOn = store.get("wd_sfx",true), bgmOn = store.get("wd_bgm",false);
  const N=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx) { if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC({latencyHint:"playback"});
      sfxBus=ctx.createGain(); sfxBus.gain.value=sfxOn?1:0; sfxBus.connect(ctx.destination);
    }catch(e){ return false; }
    if(bgmOn) startBgm();
    return true;
  }
  function tone(f,d,o={}){
    const t=ctx.currentTime+(o.at||0), os=ctx.createOscillator(), g=ctx.createGain();
    os.type=o.type||"sine"; os.frequency.setValueAtTime(f,t); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(o.vol||.15,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g); g.connect(sfxBus); os.start(t); os.stop(t+d+.05);
  }
  let nbuf=null;
  function noise(d,o={}){
    if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate); const a=nbuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
    const t=ctx.currentTime+(o.at||0), s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=nbuf; f.type=o.type||"bandpass"; f.frequency.value=o.freq||1800; f.Q.value=o.Q||1.2;
    g.gain.setValueAtTime(o.vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t+d+.02);
  }
  const sfx={
    tick(){ tone(1350,.035,{vol:.07,type:"square"}); },
    blip(i=0){ tone(N(72+[0,2,4,7,9,12][i%6]),.09,{vol:.09}); },
    beep(){ tone(N(79),.1,{vol:.08,type:"triangle"}); tone(N(84),.14,{vol:.08,type:"triangle",at:.12}); },
    pop(){ tone(520,.12,{to:900,vol:.16}); },
    toggle(on){ tone(on?660:440,.09,{vol:.12}); tone(on?990:330,.12,{vol:.1,at:.07}); },
    // 骰子在桌上咔啦咔啦：一串越來越慢的木頭碰撞聲
    rattle(){ let t=0; for(let i=0;i<11;i++){ t+=.05+i*.012; noise(.05,{at:t,freq:1400+Math.random()*1600,Q:3,vol:.22-i*.012}); tone(300+Math.random()*200,.04,{at:t,vol:.05,type:"triangle"}); } },
    land(){ noise(.12,{freq:420,Q:.8,vol:.35,type:"lowpass"}); tone(150,.18,{to:70,vol:.25}); },
    tada(){ [72,76,79,84].forEach((m,i)=>tone(N(m),.32,{at:i*.09,vol:.12,type:"triangle"})); tone(N(88),.6,{at:.36,vol:.1}); },
    cheer(){ for(let i=0;i<14;i++) noise(.08,{at:i*.035,freq:3000+Math.random()*3000,Q:4,vol:.07}); [79,84,88].forEach((m,i)=>tone(N(m),.25,{at:.05+i*.07,vol:.09})); },
    // 叭叭！兩聲方波喇叭
    honk(){ [0,.2].forEach(a=>{ tone(392,.14,{at:a,vol:.07,type:"square"}); tone(494,.14,{at:a,vol:.06,type:"square"}); }); },
    steam(){ noise(.9,{freq:5000,Q:.5,vol:.12,type:"highpass"}); for(let i=0;i<4;i++) tone(140,.08,{at:i*.12,vol:.12,type:"sawtooth",to:110}); },
    step(i){ tone(N(67+[0,2,4,5,7,9,12][i]||0),.12,{vol:.12,type:"triangle"}); noise(.05,{freq:900,Q:1,vol:.08}); },
    vroom(){ tone(90,1.1,{to:260,vol:.12,type:"sawtooth"}); noise(1,{freq:300,Q:.6,vol:.08,type:"lowpass"}); },
    oops(){ tone(330,.14,{vol:.12,type:"triangle"}); tone(262,.22,{at:.12,vol:.12,type:"triangle"}); },
  };

  /* 背景音樂：活力流行小曲，8 小節循環。
     載入時用 OfflineAudioContext 先「錄」成 WAV 交給 <audio loop>，像 FW 用 DMA 循環 buffer 播音，CPU 忙也不會斷 */
  const BPM=124, S16=60/BPM/4, LOOP=S16*16*8;
  const MEL=[
    76,0,79,0, 81,79,76,0,
    74,0,74,76, 79,0,0,0,
    72,0,76,0, 79,81,79,76,
    77,0,76,74, 72,0,0,0,
    76,0,79,0, 84,0,83,81,
    79,0,0,76, 74,0,76,79,
    81,0,79,77, 76,0,74,0,
    74,0,76,0, 79,0,0,0 ];
  // C → G → Am → F，再 C → G → F → G：流行歌最常見、聽起來最有朝氣的和弦進行
  const CH=[[48,60,64,67],[43,59,62,67],[45,57,60,64],[41,57,60,65],[48,60,64,67],[43,59,62,67],[41,57,60,65],[43,59,62,67]];
  const BGM_SR=32000, BGM_VOL=.4;
  let bgmEl=null, bgmReady=false, bgmWant=false, bgmPlaying=false;
  function encodeWav(f32,sr){
    const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i));};
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7FFF, true); }
    return new Blob([buf],{type:"audio/wav"});
  }
  function prepareBgm(){
    try{
      const sr=BGM_SR, TAIL=1.2;
      const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OAC) return;
      const oc=new OAC(1,Math.ceil((LOOP+TAIL)*sr),sr);
      const out=oc.createGain(); out.gain.value=BGM_VOL; out.connect(oc.destination);
      const nb=oc.createBuffer(1,Math.floor(sr*.3),sr); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      const noise=(t,v,d,type,freq,q=1)=>{const s2=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s2.buffer=nb;f.type=type;f.frequency.value=freq;f.Q.value=q;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s2.connect(f);f.connect(g);g.connect(out);s2.start(t);s2.stop(t+d+.02);};
      // 大鼓：頻率從 150Hz 快速掉到 45Hz，像在打拍子的心跳
      const kick=(t,v)=>{const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(out);o.start(t);o.stop(t+.3);};
      const clap=(t,v)=>{ [0,.011,.022].forEach(o=>noise(t+o,v,.1,"bandpass",1500,1.3)); };
      const hat=(t,v)=>noise(t,v,.04,"highpass",7500);
      // 貝斯：鋸齒波過低通濾波，八分音符一直推，會有往前衝的感覺
      const bass=(f,t,v,d)=>{const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.value=520;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+d+.02);};
      // 和弦：反拍短促的「鏘」，兩個方波微微走音疊起來比較亮
      const stab=(ch,t,v)=>{ ch.slice(1).forEach(m=>[-6,6].forEach(dt=>{const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type="square";o.frequency.value=N(m+12);o.detune.value=dt;
        fl.type="lowpass";fl.frequency.setValueAtTime(3200,t);fl.frequency.exponentialRampToValueAtTime(700,t+.16);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+.2);})); };
      // 主旋律：三角波＋八度方波，像清亮的電子撥弦
      const lead=(f,t,v,d)=>{ [["triangle",1,v],["square",2,v*.18]].forEach(([ty,mul,vv])=>{const o=oc.createOscillator(),g=oc.createGain();o.type=ty;o.frequency.value=f*mul;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vv,t+.01);g.gain.setValueAtTime(vv*.8,t+Math.max(.02,d*.5));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03);}); };
      for(let st=0;st<128;st++){
        const t=st*S16, bar=Math.floor(st/16), x=st%16, ch=CH[bar];
        if(x%4===0) kick(t,.5);
        if(x===4||x===12) clap(t,.13);
        if(x%4===2) hat(t,.07); else if(x%2===1) hat(t,.025);
        if(x%2===0) bass(N(ch[0]+(x%4===2?12:0)),t,.16,S16*1.7);
        if(x%4===2) stab(ch,t,.018);
        if(x%2===0){const n=MEL[bar*8+x/2]; if(n){ let d=S16*2; let k=bar*8+x/2+1; while(k<(bar+1)*8 && !MEL[k]){ d+=S16*2; k++; } lead(N(n),t,.075,Math.min(d,.8)); }}
      }
      if(true){ const t=LOOP-S16*2; noise(t,.05,S16*2,"bandpass",4000,.7); }   // 每圈結尾一個小「刷」，接回開頭
      oc.startRendering().then(buf=>{
        const d=buf.getChannelData(0), L=Math.floor(LOOP*sr);
        const loop=new Float32Array(L*2);                 // 尾音疊回開頭 → 無縫循環
        for(let i=0;i<L;i++){ const v=d[i]+(i+L<d.length?d[i+L]:0); loop[i]=v; loop[i+L]=v; }
        bgmEl=new Audio(); bgmEl.loop=true; bgmEl.preload="auto"; bgmEl.setAttribute("playsinline","");
        bgmEl.src=URL.createObjectURL(encodeWav(loop,sr));
        bgmReady=true;
        if(bgmWant) startBgm();
      }).catch(()=>{});
    }catch(e){}
  }
  prepareBgm();
  // 同時開好幾個（桌面 App＋瀏覽器分頁）時，只讓最後開始播的那個播
  const myId=Math.random().toString(36).slice(2);
  let bc=null; try{ bc=new BroadcastChannel("wd-bgm"); bc.onmessage=e=>{ if(e.data&&e.data.claim&&e.data.id!==myId) stopBgm(); }; }catch(e){}
  window.addEventListener("storage",e=>{ if(e.key==="wd_bgm_owner" && e.newValue && !e.newValue.startsWith(myId)) stopBgm(); });
  function claim(){ try{bc&&bc.postMessage({claim:1,id:myId});}catch(e){} try{localStorage.setItem("wd_bgm_owner",myId+":"+Date.now());}catch(e){} }
  function startBgm(){
    if(!bgmOn||document.hidden||updating) return;
    bgmWant=true;
    if(!bgmReady||bgmPlaying) return;
    const pr=bgmEl.play(); bgmPlaying=true; claim();
    if(pr&&pr.catch) pr.catch(()=>{ bgmPlaying=false; });
  }
  function stopBgm(){ bgmWant=false; bgmPlaying=false; if(bgmEl){ try{bgmEl.pause();}catch(e){} } }
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ stopBgm(); if(ctx&&ctx.suspend) ctx.suspend(); }
    else { if(ctx&&ctx.resume) ctx.resume().catch(()=>{}); if(bgmOn) startBgm(); }
  });
  window.addEventListener("pagehide",()=>{ stopBgm(); });
  return {
    init,
    play(name,...a){ if(!sfxOn) return; if(!init()) return; try{ sfx[name]&&sfx[name](...a); }catch(e){} },
    get sfxOn(){return sfxOn}, get bgmOn(){return bgmOn},
    _state(){ return {ctx: ctx?ctx.state:"none", playing: bgmPlaying && !!bgmEl && !bgmEl.paused, ready: bgmReady}; },
    setSfx(v){ sfxOn=v; store.set("wd_sfx",v); if(sfxBus){ sfxBus.gain.cancelScheduledValues(ctx.currentTime); sfxBus.gain.setValueAtTime(v?1:0,ctx.currentTime); } },
    setBgm(v){ bgmOn=v; store.set("wd_bgm",v); v?startBgm():stopBgm(); init(); },
  };
})();

    <!-- 窗戶 -->
    <rect x="20" y="25" width="20" height="11" rx="5" fill="#BDE6FB" stroke="${INK}" stroke-width="2.6"/>

    <path d="M24 28.5l4-2M49 28.5l4-2M76 29l4-2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 車門把手、車燈 -->

    ${wheel(32)}${wheel(84)}`;
}


/* ===== 吉祥物「叭叭車」：小露營車。戳一下會叭叭叫、講話；2.5 秒內戳 5 下 → 引擎過熱冒煙（冷卻 2 秒） ===== */
const Van=(()=>{
  const btn=$("#vanBtn"), g=$("#van"), bub=$("#bubble");
  const LINES=["叭叭！今天去哪？","油加滿了，出發吧！","往南走走好不好？","帶阿公阿嬤一起去！","下雨也有地方去喔","記得帶水壺～","行李綁好了！","找個大草地放電吧"];
  let taps=[], bubT=0, busy=false;
  const draw=(f="normal")=>{ g.innerHTML=carSvg(f); };
  function say(t,ms=1600){ bub.textContent=t; bub.classList.add("show"); clearTimeout(bubT); bubT=setTimeout(()=>bub.classList.remove("show"),ms); }
  function poke(){
    if(busy) return;
    const now=Date.now(); taps=taps.filter(x=>now-x<2500); taps.push(now);
    if(taps.length>=5){
      busy=true; taps=[]; draw("hot"); btn.classList.remove("honk"); btn.classList.add("hot"); Snd.play("steam"); say("引擎過熱了啦～",1900);
      setTimeout(()=>{ btn.classList.remove("hot"); draw(); busy=false; },2000); return;
    }
    btn.classList.remove("honk"); void btn.offsetWidth; btn.classList.add("honk");
    Snd.play("honk"); draw("happy"); say(LINES[Math.floor(Math.random()*LINES.length)]);
    setTimeout(()=>{ if(!busy) draw(); },900);
  }
  draw(); btn.onclick=poke;
  return {say,draw};
})();

/* ===== 台灣地圖：縣市亮起來、從家裡擴散的圓、方向扇形、地點小點 ===== */
const Map2=(()=>{
  const svg=$("#map"), cam=$("#cam"), card=$("#mapCard");
  let cw=360, ch=420, view={x:HP[0],y:HP[1]+40,k:1}, ringR=0, raf=0;
  // 縣市底圖
  $("#counties").innerHTML=MAP.counties.map(c=>`<path class="county" data-n="${c.n}" d="${c.d}" fill="${COUNTY_COLOR[c.n]||"#DDEFD6"}" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join("");
  $("#landClipPath").setAttribute("d",MAP.outline);
  ["#landShadow","#dimmer","#landStroke"].forEach(q=>$(q).setAttribute("d",MAP.outline));
  $("#twBase").innerHTML=MAP.counties.map(c=>`<path d="${c.d}" fill="${COUNTY_COLOR[c.n]||"#DDEFD6"}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join("")+`<path d="${MAP.outline}" fill="none" stroke="${INK}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  $("#labels").innerHTML=CITY_LABELS.map(([n,la,lo])=>{ const [x,y]=proj(la,lo); return `<g class="lbl" data-x="${x}" data-y="${y}"><text text-anchor="middle" font-size="12.5" fill="${INK}" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">${n}</text></g>`; }).join("");
  $("#home").innerHTML=`<g transform="translate(-13,-24)"><path d="M3 12 L13 3 L23 12" fill="#FF8FA3" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 11v12h14V11" fill="#FFF6E2" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><rect x="11" y="16" width="5" height="7" rx="1.5" fill="#FFD54A" stroke="${INK}" stroke-width="2"/></g><circle r="4" fill="${INK}"/>`;
  $("#pin").innerHTML=`<g class="pinIn"><path d="M0 0 C-3 -8 -12 -14 -12 -24 A12 12 0 0 1 12 -24 C12 -14 3 -8 0 0Z" fill="#FF7A59" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/><circle cy="-24" r="4.5" fill="#fff" stroke="${INK}" stroke-width="2"/></g>`;
  $("#mapVan").innerHTML=`<g transform="translate(-27,-38) scale(.5)">${carSvg("happy")}</g>`;
  function placeOrigin(){ ["#maskCirc","#rippleRing"].forEach(q=>{ $(q).setAttribute("cx",HP[0]); $(q).setAttribute("cy",HP[1]); }); $("#home").style.display=origin?"":"none"; }
  placeOrigin();

  function size(){ const r=card.getBoundingClientRect(); cw=r.width||360; ch=r.height||420; svg.setAttribute("viewBox",`0 0 ${cw} ${ch}`); }
  // 讓「不受縮放影響」的東西（小點、標籤、家、圖釘、小車）維持固定大小
  function applyView(){
    const {x,y,k}=view;
    cam.setAttribute("transform",`translate(${cw/2-k*x},${ch/2-k*y}) scale(${k})`);
    const inv=1/k;
    $$("#labels .lbl").forEach(l=>l.setAttribute("transform",`translate(${l.dataset.x},${l.dataset.y}) scale(${inv})`));
    $$("#dots .dg").forEach(d=>d.setAttribute("transform",`translate(${d.dataset.x},${d.dataset.y}) scale(${inv})`));
    $("#home").setAttribute("transform",`translate(${HP[0]},${HP[1]}) scale(${inv})`);
    const pin=$("#pin"); if(pin.dataset.x) pin.setAttribute("transform",`translate(${pin.dataset.x},${pin.dataset.y}) scale(${inv})`);
    const v=$("#mapVan"); if(v.dataset.x) v.setAttribute("transform",`translate(${v.dataset.x},${v.dataset.y}) scale(${inv*(+v.dataset.flip||1)},${inv})`);
    $("#rippleRing").setAttribute("stroke-width",2.5*inv); $("#rippleRing").setAttribute("stroke-dasharray",`${7*inv} ${5*inv}`);
    $("#maskCirc").setAttribute("r",ringR); $("#rippleRing").setAttribute("r",ringR);
    $("#landShadow").setAttribute("transform",`translate(${4*inv},${6*inv})`);
  }
  // 依「開多遠＋方向」算鏡頭：看得到整個擴散範圍
  function targetView(){
    const R=REACHES[reachIdx];
    if(!R.km || !origin){ const k=Math.min(cw/400,ch/720)*0.98; return {x:200,y:360,k,r:0}; }
    const r=R.km*KM; let x=HP[0], y=HP[1];
    if(dir!=="all"){ const d=DIRS[dir], mid=(d.from<d.to? (d.from+d.to)/2 : ((d.from+d.to+360)/2)%360)*D2R; x+=Math.sin(mid)*r*.42; y-=Math.cos(mid)*r*.42; }
    const half=r*1.12+18;
    const k=Math.min(cw/(2*half), ch/(2*half), 6);
    return {x,y,k,r};
  }
  function animateTo(ms=850){
    cancelAnimationFrame(raf);
    const a={...view,r:ringR}, b=targetView(), t0=performance.now();
    const step=now=>{
      const t=Math.min(1,(now-t0)/ms), e=ease(t);
      view={x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e, k:a.k*Math.pow(b.k/a.k,e)};
      ringR=a.r+(b.r-a.r)*e;
      applyView();
      if(t<1) raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  }
  // 擴散範圍以外蓋一層淡白；選了方向，只有那個扇形是亮的
  function paintCounties(){
    const all=!REACHES[reachIdx].km || !origin;
    $("#dimmer").style.display=$("#rippleRing").style.display = all?"none":"";
  }
  function paintWedge(){
    if(dir==="all"){ $("#wedgeClipPath").setAttribute("d",""); $("#maskG").removeAttribute("clip-path"); return; }
    const d=DIRS[dir], R=1500, a1=d.from*D2R, a2=(d.to<d.from?d.to+360:d.to)*D2R;
    const p=a=>`${HP[0]+Math.sin(a)*R} ${HP[1]-Math.cos(a)*R}`;
    $("#wedgeClipPath").setAttribute("d",`M${HP[0]} ${HP[1]} L${p(a1)} A${R} ${R} 0 ${(a2-a1)>Math.PI?1:0} 1 ${p(a2)} Z`);
    $("#maskG").setAttribute("clip-path","url(#wedgeClip)");
  }
  function paintDots(){
    // 只畫符合條件的點（不符合的灰點拿掉，地圖比較乾淨）
    const all=spots().filter(s=>s.lat!=null && isCandidate(s));
    $("#dots").innerHTML=all.map(s=>{ const [x,y]=proj(s.lat,s.lng);
      return `<g class="dg" data-id="${esc(s.id)}" data-x="${x}" data-y="${y}"><circle class="dot on" r="5.5" fill="#FF7A59" stroke="#fff" stroke-width="2"/></g>`; }).join("");
    applyView();
  }
  // 地點在哪個縣市：用 SVG 的 isPointInFill 判斷點在不在縣市形狀裡（結果記起來，不用每次算）
  const cCache={};
  function countyOf(s){
    if(s.id in cCache) return cCache[s.id];
    const [x,y]=proj(s.lat,s.lng); let hit=null;
    for(const p of $$("#counties .county")){ try{ if(p.isPointInFill(new DOMPoint(x,y))){ hit=p.dataset.n; break; } }catch(e){} }
    if(!hit){ let best=1e9; for(const p of $$("#counties .county")){ const b=p.getBBox(), dx=b.x+b.width/2-x, dy=b.y+b.height/2-y, d=dx*dx+dy*dy; if(d<best){ best=d; hit=p.dataset.n; } } }
    return cCache[s.id]=hit;
  }
  function litCounty(n){ $$("#counties .county").forEach(p=>p.classList.toggle("lit",p.dataset.n===n)); }
  function countyCenter(n){ const p=$(`#counties .county[data-n="${n}"]`); if(!p) return [0,0]; const b=p.getBBox(); return [b.x+b.width/2,b.y+b.height/2]; }
  function hidePick(){ litCounty(null); $("#pin").style.display="none"; $("#mapVan").style.display="none"; delete $("#pin").dataset.x; delete $("#mapVan").dataset.x; }
  function flash(id,on){ const g=$(`#dots .dg[data-id="${CSS.escape(id)}"] circle`); if(g) g.classList.toggle("flash",on); }
  // 小動畫：數值補間（給圖釘落下、小車開過去用）
  function tween(ms,fn){ return new Promise(res=>{ const t0=performance.now(); const st=now=>{ const t=Math.min(1,(now-t0)/ms); fn(t); if(t<1) requestAnimationFrame(st); else res(); }; requestAnimationFrame(st); }); }
  async function dropPin(s){
    const [x,y]=proj(s.lat,s.lng), pin=$("#pin"), inn=pin.querySelector(".pinIn");
    pin.dataset.x=x; pin.dataset.y=y; pin.style.display=""; applyView();
    await tween(380,t=>{ const b=t<.6? -60*(1-t/.6)*(1-t/.6) : -10*Math.sin((t-.6)/.4*Math.PI); inn.setAttribute("transform",`translate(0,${b})`); });
    inn.removeAttribute("transform");
  }
  async function drive(s){
    const [x,y]=proj(s.lat,s.lng), v=$("#mapVan");
    v.dataset.flip = x<HP[0] ? -1 : 1; v.style.display="";
    await tween(650,t=>{ const e=ease(t); v.dataset.x=HP[0]+(x-HP[0])*e; v.dataset.y=HP[1]+(y-HP[1])*e - Math.sin(t*Math.PI)*8/view.k; applyView(); });
  }
  function refresh(anim=true){ size(); placeOrigin(); paintCounties(); paintWedge(); paintDots(); anim?animateTo():(()=>{ const b=targetView(); view={x:b.x,y:b.y,k:b.k}; ringR=b.r; applyView(); })(); }
  window.addEventListener("resize",()=>{ size(); const b=targetView(); view={x:b.x,y:b.y,k:b.k}; ringR=b.r; applyView(); });
  let tapCb=null;
  svg.addEventListener("click",e=>{
    if(!tapCb) return;
    const r=svg.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
    const mx=(sx-(cw/2-view.k*view.x))/view.k, my=(sy-(ch/2-view.k*view.y))/view.k;
    const [lat,lng]=unproj(mx,my); const cb=tapCb; tapCb=null; card.classList.remove("tapping"); cb(lat,lng);
  });
  const waitTap=cb=>{ tapCb=cb; card.classList.add("tapping"); };
  const cancelTap=()=>{ tapCb=null; card.classList.remove("tapping"); };
  function snap(){ size(); const b=targetView(); view={x:b.x,y:b.y,k:b.k}; ringR=b.r; applyView(); }
  // 地圖放大／縮小：卡片高度用 CSS 動畫，動畫期間每一格重新對焦
  function setBig(on){
    if(card.classList.contains("big")===!!on) return Promise.resolve();
    card.classList.toggle("big",!!on);
    $("#zoomBtn").innerHTML=ui(on?"shrink":"expand",18);
    $("#zoomBtn").setAttribute("aria-label",on?"縮小地圖":"放大地圖");
    return new Promise(res=>{ const t0=performance.now(); const f=now=>{ snap(); if(now-t0<520) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  }
  return {refresh,animateTo,paintDots,hidePick,flash,dropPin,drive,size,waitTap,cancelTap,setBig,snap,countyOf,litCounty,countyCenter};
})();

function tagIcons(s,sz,max=4){ const t=TAGS.filter(x=>s.tags.includes(x.ch)); return t.slice(0,max).map(x=>ui(x.ic,sz)).join("")+(t.length>max?`<b class="more">+${t.length-max}</b>`:""); }
const CK=on=>`<span class="ck">${on?`<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.3l2.6 2.6L10 3.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</span>`;

const EXTRA=()=>[
  ["adult","大人在意（全部都要有）",TAGS.filter(t=>t.g==="adult").map(t=>[t.key,t.ic,t.label])],
  ["kid","更細的玩法（全部都要有）",TAGS.filter(t=>t.g==="kid").map(t=>[t.key,t.ic,t.label])],
  ["ex","排除",[["noresv","calendar","不要需預約的"],["avoid","clock","避開 30 天內去過"],["far","car",`不要太近（${reachRange().min||15} 分鐘以上）`]]],
];
const isOn=k=>k==="far"?far:!!flt[k];
function toggleCond(k){ if(k==="far"){ far=!far; store.set("wd_far",far); } else { flt[k]=!flt[k]; store.set("wd_flt",flt); } Snd.play("toggle",isOn(k)); Map2.hidePick(); }
function countWith(fn){ const s0=scene; const r=fn(); scene=s0; return r; }
function renderScenes(){

  $("#scenes").innerHTML=Object.entries(SCENES).map(([k,s])=>{ const c=n(k); return `<button class="scene ${scene===k?"on":""} ${c?"":"zero"}" data-s="${k}">

function renderOriginTag(){ $("#fromTag").innerHTML=ui("pin",16)+originName()+`<span class="chg">${origin?"更改":"點我設定"}</span>`; $("#mapCard").classList.toggle("noOrigin",!origin); }
function locate(){
  if(!navigator.geolocation){ toast("這支手機不能定位，改用地圖點選吧"); return; }
  toast("定位中…");
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude;
    if(lat<21.8||lat>25.4||lng<119.9||lng>122.1){ toast("你好像不在台灣本島，改用地圖點選吧"); return; }
    setOrigin({lat,lng,kind:"gps",label:nearestCity(lat,lng)+"附近"},`出發點：目前位置（${nearestCity(lat,lng)}附近）`);
  },err=>{ toast(err.code===1?"沒有定位權限，可以到設定打開，或改用地圖點選":"定位失敗，改用地圖點選吧"); },{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
function showOrigin(){
  const near=origin?`${nearestCity(origin.lat,origin.lng)}附近`:"";
  openSheet(`<div class="sheetBody form">

    <div class="note2" style="font-size:14px;line-height:1.6">${origin?`現在：${originName()}（${near}）`:"先設定出發點，地圖才知道要從哪裡擴散。"}<br>位置只存在這支手機裡，不會傳到任何地方。</div>
    <div style="display:grid;gap:10px;margin-top:12px">
      <button class="btn yellow" id="oGps">${ui("pin",20)}用我現在的位置</button>
      <button class="btn" id="oMap">${ui("map",20)}在地圖上點一下</button>
      ${homeSpot?`<button class="btn green" id="oHome">${ui("home",20)}從家出發（${nearestCity(homeSpot.lat,homeSpot.lng)}附近）</button>`:""}
      ${origin && origin.kind!=="home"?`<button class="btn" id="oSave">${ui("home",20)}把現在的出發點存成「家」</button>`:""}
    </div>

/* 隨機決定開多遠：在幾個距離之間跳來跳去，最後停在一個（取代原本的骰子） */
async function randomReach(){
  if(rolling) return;
  if(!origin){ Snd.play("pop"); showOrigin(); return; } rolling=true; Map2.hidePick();
  $("#rndBtn").classList.add("spin"); Van.say("這次開多遠呢～",1200);
  let i=reachIdx, final=Math.floor(Math.random()*REACHES.length);
  const steps=7+Math.floor(Math.random()*3);
  for(let k=0;k<steps;k++){
    i = k===steps-1 ? final : (i+1+Math.floor(Math.random()*(REACHES.length-1)))%REACHES.length;
    reachIdx=i; renderReach(); Map2.refresh(false); Snd.play("blip",k%6);
    $("#rndDie").innerHTML=dieSvg(1+Math.floor(Math.random()*6));
    await sleep(60+k*k*4);
  }
  store.set("wd_reach",reachIdx); $("#rndBtn").classList.remove("spin"); $("#rndDie").innerHTML=dieSvg(Math.min(6,reachIdx+1));
  renderHome(); Snd.play("tada"); Van.say(`這次：${REACHES[reachIdx].name}！`,1600);

}

/* 幫我挑一個：候選地點輪流閃 → 停在一個 → 圖釘落下 → 小車開過去 → 明信片 */
async function pick(){
  if(rolling) return;
  if(!origin){ Snd.play("pop"); showOrigin(); return; }
  const pool=candidates();
  if(!pool.length){ Snd.play("oops"); toast("沒有符合條件的地點，開遠一點或拿掉一些條件試試"); $("#goBtn").animate([{transform:"translateX(0)"},{transform:"translateX(-9px)"},{transform:"translateX(9px)"},{transform:"none"}],{duration:300}); return; }
  let p2=pool.length>1?pool.filter(s=>s.id!==lastId):pool;
  const spot=p2[Math.floor(Math.random()*p2.length)]; lastId=spot.id;
  rolling=true; $("#goBtn").disabled=true; Map2.hidePick();
  window.scrollTo({top:0,behavior:"smooth"});
  await Map2.setBig(true);
  Van.say("我找找看…",1400);
  const onMap=pool.filter(s=>s.lat!=null);
  $("#mapCard").classList.add("picking");
  // 跑馬燈：有地點的縣市繞著出發點一個一個亮，越跑越慢，最後停在挑中的那個縣市
  const byC={}; onMap.forEach(s=>{ const c=Map2.countyOf(s); (byC[c]=byC[c]||[]).push(s); });
  const target=spot.lat!=null?Map2.countyOf(spot):null;
  let cs=Object.keys(byC);
  const ang=n=>{ const [x,y]=Map2.countyCenter(n); return Math.atan2(x-HP[0],-(y-HP[1])); };
  cs.sort((a,b)=>ang(a)-ang(b));
  const lightDots=(n,on)=>(byC[n]||[]).forEach(s=>Map2.flash(s.id,on));
  if(cs.length>1 && target){
    const ti=cs.indexOf(target), L=cs.length;
    let loops=Math.max(1,Math.ceil((14-ti)/L)); while(loops*L+ti>30 && loops>1) loops--;
    const total=loops*L+ti; let prev=null;
    for(let k=0;k<=total;k++){
      const n=cs[k%L];
      if(prev) lightDots(prev,false);
      Map2.litCounty(n); lightDots(n,true); prev=n;
      Snd.play("blip",k);
      const p=k/total; await sleep(45+Math.pow(p,2.4)*260);
    }
    lightDots(prev,false);
    await sleep(120);
  } else {
    // 只有一個縣市：在這個縣市裡的地點之間跳
    if(target) Map2.litCounty(target);
    const pool2=target?byC[target]:onMap; let prev=null; const steps=Math.min(14,Math.max(6,pool2.length*2));
    for(let k=0;k<steps && pool2.length>1;k++){
      const s=k===steps-1?spot:pool2[Math.floor(Math.random()*pool2.length)];
      if(prev) Map2.flash(prev,false); Map2.flash(s.id,true); prev=s.id; Snd.play("blip",k);
      await sleep(60+Math.pow(k/steps,2.2)*240);
    }
    if(prev) Map2.flash(prev,false);
  }
  $("#mapCard").classList.remove("picking");
  if(spot.lat!=null){ Map2.flash(spot.id,true); Snd.play("pop"); await Map2.dropPin(spot); Snd.play("beep"); await Map2.drive(spot); }
  Snd.play("tada"); Van.say(`去${spot.name.replace(/（.*?）/,"").slice(0,8)}！`,1800);
  await sleep(150);
  rolling=false; $("#goBtn").disabled=false;
  if(sheetOpen()) toast(`挑到：${spot.name}`); else showResult(spot);
}

/* 明信片上的小地圖：從家裡到目的地的虛線 */
function viewSvg(s,b){
  if(s.lat==null) return `<svg viewBox="0 0 400 132" preserveAspectRatio="xMidYMid slice"><rect width="400" height="132" fill="${b.l}"/><circle cx="60" cy="40" r="18" fill="#FFD54A" stroke="${INK}" stroke-width="3"/><path d="M0 112 Q120 84 230 108 T400 100 V132 H0Z" fill="#8FCF6B" stroke="${INK}" stroke-width="3"/></svg>`;
  const [x,y]=proj(s.lat,s.lng), [hx,hy]=HP;
  let x0=Math.min(x,hx), x1=Math.max(x,hx), y0=Math.min(y,hy), y1=Math.max(y,hy);
  const pad=Math.max(14,(x1-x0+y1-y0)*.25); x0-=pad; x1+=pad; y0-=pad; y1+=pad;
  let w=x1-x0, h=y1-y0; const A=400/132;
  if(w/h<A){ const nw=h*A; x0-=(nw-w)/2; w=nw; } else { const nh=w/A; y0-=(nh-h)/2; h=nh; }
  const u=w/400;
  return `<svg viewBox="${x0} ${y0} ${w} ${h}" preserveAspectRatio="xMidYMid slice"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#CDEAF9"/><use href="#twBase"/>
    <path d="M${hx} ${hy} Q${(hx+x)/2+ (y-hy)*.15} ${(hy+y)/2-(x-hx)*.15} ${x} ${y}" fill="none" stroke="${b.c}" stroke-width="${3.5*u}" stroke-dasharray="${8*u} ${6*u}" stroke-linecap="round"/>
    <circle cx="${hx}" cy="${hy}" r="${6*u}" fill="#FFD54A" stroke="${INK}" stroke-width="${2.2*u}"/>
    <g transform="translate(${x} ${y}) scale(${u})"><path d="M0 0 C-3 -8 -12 -14 -12 -24 A12 12 0 0 1 12 -24 C12 -14 3 -8 0 0Z" fill="#FF7A59" stroke="${INK}" stroke-width="2.6"/><circle cy="-24" r="4.5" fill="#fff" stroke="${INK}" stroke-width="2"/></g></svg>`;
}
function postmark(){
  const d=new Date(), ds=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  return `<svg class="pm" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="${INK}" stroke-width="2.5"/><circle cx="42" cy="42" r="28" fill="none" stroke="${INK}" stroke-width="1.5"/>

}

/* ===== 資料匯出／匯入（換網址、換手機搬家用） =====
   localStorage 依網址分開存（像每塊板子各有一顆 EEPROM），換網址就讀不到舊資料，
   所以把要搬的 key 打包成一段代碼：WD1: + base64(JSON)。 */
const SYNC_KEYS=["wd_data","wd_hist","wd_reach","wd_dir","wd_far","wd_scene","wd_flt","wd_sfx","wd_bgm"];
const b64e=str=>btoa(unescape(encodeURIComponent(str)));
const b64d=str=>decodeURIComponent(escape(atob(str)));
function makeExportCode(){
  const d={}; SYNC_KEYS.forEach(k=>{ const v=store.get(k,undefined); if(v!==undefined) d[k]=v; });
  return "WD1:"+b64e(JSON.stringify({app:"weekend-dice",v:1,at:Date.now(),data:d}));
}
function parseExportCode(code){
  code=String(code||"").trim().replace(/\s+/g,"");
  const i=code.indexOf("WD1:"); if(i<0) throw new Error("找不到代碼開頭 WD1:");
  const o=JSON.parse(b64d(code.slice(i+4)));
  if(!o || o.app!=="weekend-dice" || typeof o.data!=="object") throw new Error("不是假日骰骰的資料");
  const d=o.data;
  if(d.wd_data && (typeof d.wd_data!=="object" || !Array.isArray(d.wd_data.added||[]) || !Array.isArray(d.wd_data.deleted||[]))) throw new Error("名單資料格式不對");
  if(d.wd_hist && !Array.isArray(d.wd_hist)) throw new Error("足跡資料格式不對");
  return o;
}
function summary(d){
  const dd=d.wd_data||{}, n=Object.keys(dd.edits||{}).length+(dd.added||[]).length+(dd.deleted||[]).length;
  return {custom:(dd.added||[]).length, changed:n, hist:(d.wd_hist||[]).length};
}
function showExport(){
  const code=makeExportCode(), sm=summary(JSON.parse(b64d(code.slice(4))).data);
  openSheet(`<div class="sheetBody form">
    <h2>匯出資料</h2>
    <div class="note2" style="font-size:14px;line-height:1.6">打包了：自己新增 ${sm.custom} 個地點、改過的名單 ${sm.changed} 處、足跡 ${sm.hist} 筆，還有條件和音效設定。<br>複製下面這段代碼，到新的 App「足跡 → 匯入資料」貼上就好。</div>
    <textarea id="exCode" readonly style="font-size:12px;line-height:1.4;min-height:110px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px;word-break:break-all">${code}</textarea>
    <div class="formActs"><button class="btn yellow" id="exCopy">${ui("check",20)}複製代碼</button>${navigator.share?`<button class="btn" id="exShare">${ui("nav",20)}分享</button>`:""}</div>
  </div>`);
  $("#exCopy").onclick=async()=>{
    let ok=false;
    try{ await navigator.clipboard.writeText(code); ok=true; }catch(e){}
    if(!ok){ try{ const t=$("#exCode"); t.removeAttribute("readonly"); t.select(); t.setSelectionRange(0,code.length); ok=document.execCommand("copy"); t.setAttribute("readonly",""); }catch(e){} }
    Snd.play(ok?"tada":"oops"); toast(ok?"代碼複製好了！":"沒辦法自動複製，請長按代碼全選複製");
  };
  if($("#exShare")) $("#exShare").onclick=()=>{ navigator.share({title:"假日骰骰資料",text:code}).catch(()=>{}); };
}
function showImport(){
  openSheet(`<div class="sheetBody form">
    <h2>匯入資料</h2>
    <div class="note2" style="font-size:14px;line-height:1.6">把舊 App 匯出的代碼貼在下面（開頭是 WD1:），或選存下來的檔案。</div>
    <textarea id="imCode" placeholder="WD1:……" style="font-size:12px;line-height:1.4;min-height:100px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px;word-break:break-all"></textarea>
    <label style="margin-top:10px">或選檔案</label><input type="file" id="imFile" accept=".txt,.json,text/plain,application/json">
    <div id="imInfo" class="note2" style="font-size:14px;margin-top:10px"></div>
    <div class="formActs"><button class="btn" id="imCheck">${ui("search",20)}檢查</button><button class="btn green" id="imGo" disabled style="opacity:.5">${ui("check",20)}確認匯入</button></div>
  </div>`);
  let parsed=null;
  const check=()=>{
    try{ parsed=parseExportCode($("#imCode").value); const sm=summary(parsed.data);
      $("#imInfo").innerHTML=`找到：自己新增 <b>${sm.custom}</b> 個地點、改過的名單 <b>${sm.changed}</b> 處、足跡 <b>${sm.hist}</b> 筆。<br>名單和設定會換成這份；足跡會合併，不會重複。`;
      $("#imGo").disabled=false; $("#imGo").style.opacity=1; Snd.play("pop");
    }catch(e){ parsed=null; $("#imInfo").textContent="代碼看不懂："+e.message; $("#imGo").disabled=true; $("#imGo").style.opacity=.5; Snd.play("oops"); }
  };
  $("#imCheck").onclick=check;
  $("#imFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("#imCode").value=String(r.result); check(); }; r.readAsText(f); };
  $("#imGo").onclick=()=>{ if(!parsed) return; applyImport(parsed.data); closeSheet(); };
}
function applyImport(d){
  if(d.wd_data){ data=Object.assign({edits:{},added:[],deleted:[]},d.wd_data); saveData(); }
  if(d.wd_hist){
    const seen=new Set(hist.map(h=>h.id+"@"+h.t));
    d.wd_hist.forEach(h=>{ if(h && h.id && h.t && !seen.has(h.id+"@"+h.t)){ hist.push(h); seen.add(h.id+"@"+h.t); } });
    hist.sort((a,b)=>a.t-b.t); if(hist.length>500) hist=hist.slice(-500); store.set("wd_hist",hist);
  }
  if(d.wd_reach!==undefined){ reachIdx=Math.max(0,Math.min(REACHES.length-1,+d.wd_reach||0)); store.set("wd_reach",reachIdx); }
  if(d.wd_dir && DIRS[d.wd_dir]){ dir=d.wd_dir; store.set("wd_dir",dir); }
  if(typeof d.wd_far==="boolean"){ far=d.wd_far; store.set("wd_far",far); }
  if(typeof d.wd_scene==="string"){ scene=d.wd_scene; store.set("wd_scene",scene); }
  if(d.wd_flt) { flt=Object.assign({avoid:false,noresv:false},d.wd_flt); store.set("wd_flt",flt); }
  if(typeof d.wd_sfx==="boolean") Snd.setSfx(d.wd_sfx);
  if(typeof d.wd_bgm==="boolean" && d.wd_bgm!==Snd.bgmOn) Snd.setBgm(d.wd_bgm);
  paintSndBtns(); renderAll(); Snd.play("tada"); confetti(); toast("匯入完成！");
}

        <span class="stub" style="background:${b.c}">${s.min}<small>分鐘</small></span>
        <span class="tx"><div class="nm">${esc(s.name)}${s.off?`<span class="badge gray">不挑</span>`:""}${visitedRecently(s.id)?`<span class="badge">最近去過</span>`:""}</div><div class="ar">${esc(s.area)}・${s.min<=20?"附近":dirName(dirOf(s))}${s.note?"・"+esc(s.note):""}</div></span>
        <span class="tg">${tagIcons(s,17)}</span></button>`).join("");
  }
  $("#list").innerHTML = h || `<div class="empty">找不到地點<br>按右下角的 ＋ 加一個吧！</div>`;
  $$("#list .tk").forEach(r=>r.onclick=()=>{ Snd.play("pop"); editSpot(r.dataset.id); });
}

/* ===== 足跡頁 ===== */
function armBtn(el,label,fn){ let armed=false,t=0; el.onclick=()=>{ if(!armed){ armed=true; Snd.play("oops"); el.querySelector(".r").textContent=label; clearTimeout(t); t=setTimeout(()=>{ armed=false; renderTrail(); },3500); return; } fn(); }; }
function renderTrail(){
  $("#trailTitle").innerHTML=`${ui("foot",28)}出遊足跡`;
  const ids=new Set(hist.map(h=>h.id)), yr=new Date().getFullYear();
  const thisYear=hist.filter(h=>new Date(h.t).getFullYear()===yr).length;
  $("#stats").innerHTML=`<div class="stat"><b>${thisYear}</b><small>${yr} 年出門次數</small></div><div class="stat"><b>${ids.size}</b><small>去過的地方</small></div>`;
  const all=spots(), byId=Object.fromEntries(all.map(s=>[s.id,s]));
  const recent=[...hist].sort((a,b)=>b.t-a.t).slice(0,40);
  $("#trail").innerHTML = recent.length ? recent.map(h=>{
    const s=byId[h.id], name=s?s.name:(h.name||"（已刪除的地點）"), min=s?s.min:(h.min||0), b=bucketOf(min||1);
    return `<div class="stop" style="--c:${b.c}"><div class="d">${fmtDate(h.t)}・約 ${min} 分鐘</div><div class="n">${esc(name)}</div></div>`;
  }).join("") : `<div class="empty" style="margin-left:-26px">${ui("car",40)}<br>還沒有足跡<br>挑到喜歡的地點，按「就去這！」就會記在這裡</div>`;
  $("#settings").innerHTML=`
    <button class="set" id="sBgm">${ui("note",20)}背景音樂<span class="r">${Snd.bgmOn?"開":"關"}</span></button>
    <button class="set" id="sSfx">${ui("speaker",20)}音效<span class="r">${Snd.sfxOn?"開":"關"}</span></button>
    <button class="set" id="sLog">${ui("spark",20)}改版紀錄<span class="r">v${APP_VERSION}</span></button>
    <button class="set" id="sExport">${ui("box",20)}匯出資料<span class="r">換手機、換網址用</span></button>
    <button class="set" id="sImport">${ui("boxIn",20)}匯入資料<span class="r">貼上匯出的代碼</span></button>
    <button class="set" id="sReset">${ui("reset",20)}還原內建名單<span class="r">自己新增的會保留</span></button>
    <button class="set danger" id="sClear">${ui("trash",20)}清除足跡<span class="r">${hist.length} 筆</span></button>`;
  $("#sBgm").onclick=()=>setBgm(!Snd.bgmOn);
  $("#sSfx").onclick=()=>setSfx(!Snd.sfxOn);
  $("#sLog").onclick=()=>{ Snd.play("pop"); showLog(); };
  $("#sExport").onclick=()=>{ Snd.play("pop"); showExport(); };
  $("#sImport").onclick=()=>{ Snd.play("pop"); showImport(); };
  armBtn($("#sReset"),"再按一次確認還原",()=>{ data.edits={}; data.deleted=[]; saveData(); toast("內建名單已還原"); Snd.play("tada"); renderAll(); });
  armBtn($("#sClear"),"再按一次確認清除",()=>{ hist=[]; store.set("wd_hist",hist); toast("足跡清掉了"); renderAll(); });
  $("#footCount").textContent=`口袋名單 ${all.length} 個地點`;
}

/* ===== 新增／編輯地點 ===== */
function editSpot(id){
  const s = id ? spots().find(x=>x.id===id) : {id:null,name:"",area:"",min:30,tags:[],note:"",off:false};
  if(!s) return;
  const f={...s,tags:[...s.tags]}; f.d = s.min<=20 && !s.dir ? "near" : dirOf(s);
  const isBase = !!f.id && f.id.startsWith("b:");
  openSheet(`<div class="sheetBody form">
    <h2>${id?"編輯地點":"新增地點"}</h2>
    <label>名稱</label><input type="text" id="fName" maxlength="40" value="${esc(f.name)}" placeholder="例如：南寮漁港">
    <label>地區</label><input type="text" id="fArea" maxlength="20" value="${esc(f.area)}" placeholder="例如：新竹市">
    <label>從出發點開車大約幾分鐘${s.baseMin?"（目前是估計的，改了就照你的）":""}</label>
    <div class="minRow"><button id="mMinus">−</button><output id="fMin"></output><button id="mPlus">＋</button><span class="tl" id="fTier"></span></div>
    <label>在哪個方向</label><div class="seg dirSeg" id="fDir" style="grid-template-columns:repeat(5,1fr)"></div>
    <label>貼上標籤</label><div class="tags" id="fTags"></div>
    <label>一句話備註</label><textarea id="fNote" maxlength="80" placeholder="例如：有大草皮、記得帶防曬">${esc(f.note||"")}</textarea>
    <div class="sw"><span class="t">${ui("eyeoff",20)}先不要挑到這裡</span><button id="fOff" class="${f.off?"on":""}" aria-label="不要挑到"></button></div>
    <div class="formActs">
      ${id?`<button class="btn danger" id="fDel">刪除</button>`:""}
      <button class="btn green" id="fSave">${ui("check",20)}儲存</button>
    </div>
  </div>`);
  const paintMin=()=>{ const b=bucketOf(f.min); $("#fMin").textContent=f.min+" 分"; $("#fTier").textContent=b.name; $("#fTier").style.background=b.c; };
  const paintDir=()=>{ $("#fDir").innerHTML=[["near","附近"],["N","往北"],["E","往東"],["S","往南"],["W","往西"]].map(([k,n])=>`<button data-d="${k}" class="${f.d===k?"on":""}">${n}</button>`).join("");
    $$("#fDir button").forEach(b=>b.onclick=()=>{ f.d=b.dataset.d; Snd.play("pop"); paintDir(); }); };
  const ck=on=>`<span class="ck">${on?`<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.3l2.6 2.6L10 3.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</span>`;
  const paintTags=()=>{ $("#fTags").innerHTML=TAGS.map(t=>`<button class="ltag ${f.tags.includes(t.ch)?"on":""}" data-ch="${t.ch}">${ck(f.tags.includes(t.ch))}${ui(t.ic,19)}${t.label}</button>`).join("");
    $$("#fTags .ltag").forEach(b=>b.onclick=()=>{ const c=b.dataset.ch; f.tags=f.tags.includes(c)?f.tags.filter(x=>x!==c):f.tags.concat(c); Snd.play("toggle",f.tags.includes(c)); paintTags(); }); };
  paintMin(); paintDir(); paintTags();
  const step=d=>{ f.min=Math.max(5,Math.min(300,f.min+d)); Snd.play("pop"); paintMin(); };
  $("#mMinus").onclick=()=>step(-5); $("#mPlus").onclick=()=>step(5);
  $("#fOff").onclick=e=>{ f.off=!f.off; e.currentTarget.classList.toggle("on",f.off); Snd.play("toggle",!f.off); };
  $("#fSave").onclick=()=>{
    f.name=$("#fName").value.trim(); f.area=$("#fArea").value.trim(); f.note=$("#fNote").value.trim();
    if(!f.name){ toast("名稱要填喔"); $("#fName").focus(); return; }
    const out={name:f.name,area:f.area,min:f.min,tags:f.tags,note:f.note,off:f.off};
    if(isBase && f.min!==s.min) out.manual=true;                 // 自己改過車程 → 之後都照這個
    if(isBase && f.min===s.min && s.baseMin){ out.min=s.baseMin; }  // 沒改 → 維持估計
    // 方向：跟地圖算出來的一樣就不另外存（內建地點有座標）
    const auto = s.lat!=null ? dirOf({...s,dir:undefined}) : null;
    if(f.d!=="near" && f.d!==auto) out.dir=f.d; else if(f.d==="near" && s.lat==null) out.dir=undefined;
    if(s.lat!=null){ out.lat=s.lat; out.lng=s.lng; }
    if(!id){ data.added.push(Object.assign({id:"u:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},out)); toast("新增好了！"); }
    else if(isBase){ data.edits[id]=out; toast("改好了！"); }
    else { const i=data.added.findIndex(x=>x.id===id); if(i>=0) data.added[i]=Object.assign({id},out); toast("改好了！"); }
    saveData(); Snd.play("tada"); closeSheet(); renderAll();
  };
  if(id){
    let armed=false;
    $("#fDel").onclick=e=>{
      if(!armed){ armed=true; e.currentTarget.classList.add("armed"); e.currentTarget.textContent="再按一次刪除"; Snd.play("oops"); return; }
      if(isBase){ data.deleted.push(id); delete data.edits[id]; } else data.added=data.added.filter(x=>x.id!==id);
      saveData(); toast("刪掉了"); closeSheet(); renderAll();
    };
  }
}

/* ===== 版本 & 改版紀錄 ===== */

const CHANGELOG=[

  ["1.1.0","11/08","搬新家＋小露營車！",["直接點骰子就會骰，骰到幾點，小露營車就在小路上往前開幾格","叭叭車換成圓滾滾的小露營車","App 搬到新網址；足跡頁多了「匯出資料／匯入資料」，可以把舊資料搬過來"]],
  ["1.0.0","11/05","假日骰骰上線！",["骰到幾點就去哪一區：1・2 點近郊、3・4 點小旅行、5 點遠一點、6 點出遠門","點路牌可以直接指定車程，再貼上雨天、好走、免門票、有得吃等條件","內建 140 個從新豐出發的地點，可以自己新增、編輯、刪除","結果是一張明信片，一鍵 Google 地圖導航；按「就去這！」會記到出遊足跡"]],
];
const verNum=v=>v.split(".").reduce((a,x,i)=>a+(+x)*Math.pow(1000,2-i),0);
function showLog(onlyNew){
  const list = onlyNew ? CHANGELOG.filter(([v])=>verNum(v)>verNum(onlyNew)) : CHANGELOG;
  openSheet(`<div class="sheetBody log">
    <h3>${ui("spark",22)}${onlyNew?"更新囉！":"改版紀錄"}</h3>
    ${onlyNew?`<div class="new">假日骰骰更新到 v${APP_VERSION}，這次多了：</div>`:""}
    ${list.map(([v,d,t,items])=>`<div class="v"><div class="vh"><i>v${v}</i>${t}<small>${d}</small></div><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
    <button class="btn yellow closeBtn" id="logClose">${onlyNew?"好，來骰一下！":"關閉"}</button></div>`);
  $("#logClose").onclick=closeSheet;
}
$("#verBtn").textContent="v"+APP_VERSION; $$(".footVer").forEach(e=>e.textContent="v"+APP_VERSION);
$("#verBtn").onclick=()=>{ Snd.play("pop"); showLog(); };
(function(){
  const seen=store.get("wd_seen_ver",null);
  if(seen && verNum(seen)<verNum(APP_VERSION)) splashDone.then(()=>setTimeout(()=>{ if(!updating) showLog(seen); },300));
  if(!seen || verNum(APP_VERSION)>verNum(seen)) store.set("wd_seen_ver",APP_VERSION);   // 只往前記：舊快取頁不會把紀錄倒回去

/* ===== 自動檢查更新（像 FW 的 OTA：問伺服器 version.json，比手上新就重新載入） ===== */
async function checkUpdate(){
  if(updating || !/(github\.io|web\.app|firebaseapp\.com)$/.test(location.hostname)) return;   // 只在正式網址檢查，本機測試不檢查
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(verNum(j.version)>verNum(APP_VERSION)){
      updating=true;
      const go=()=>location.replace(location.pathname+"?v="+j.version);
      if(document.body.classList.contains("booting")) go();
      else if(!rolling && !sheetOpen()){ toast("有新版本 v"+j.version+"，更新中…"); setTimeout(go,900); }
      else { toast("有新版本 v"+j.version+"，關掉視窗後自動更新"); const t=setInterval(()=>{ if(!rolling && !sheetOpen()){ clearInterval(t); go(); } },1000); }
    }
  }catch(e){}
}
if(location.search.includes("v=")) try{ history.replaceState(null,"",location.pathname); }catch(e){}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkUpdate(); try{ document.getAnimations().forEach(a=>{ if(a.playState!=="finished"){ a.pause(); a.play(); } }); }catch(e){} } });

/* ===== 開機畫面：天空 → 台灣浮出來 → 從家裡一圈圈擴散 → 字一個個跳出 → 標題飛到首頁（FLIP） ===== */
(function(){
  const sp=$("#splash"); if(!sp){ splashDoneR(); return; }
  const o=`transform-box:view-box;transform-origin:${HP[0]}px ${HP[1]}px`;   // 從出發點（沒設定就從北台灣）擴散
  $("#spMap").innerHTML=`<svg viewBox="0 0 400 720"><use href="#twBase"/>
    <circle class="sp-ring" stroke-width="7" cx="${HP[0]}" cy="${HP[1]}" r="260" style="${o}"/><circle class="sp-ring r2" stroke-width="7" cx="${HP[0]}" cy="${HP[1]}" r="260" style="${o}"/><circle class="sp-ring r3" stroke-width="7" cx="${HP[0]}" cy="${HP[1]}" r="260" style="${o}"/>
    <circle cx="${HP[0]}" cy="${HP[1]}" r="9" fill="#FFD54A" stroke="${INK}" stroke-width="3"/></svg>`;
  const tt=$("#spTitle");
  tt.innerHTML=[..."假日骰骰"].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("");
  const centerTitle=()=>{ tt.style.left=Math.round((window.innerWidth-tt.getBoundingClientRect().width)/2)+"px"; };
  centerTitle();
  setTimeout(()=>sp.classList.add("sp-live"),150);   // 前 0.15 秒跟 iPhone 啟動圖一樣：只有天空底色
  let out=false;
  function exit(){
    if(out) return; out=true;
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finish=()=>{ sp.remove(); document.body.classList.remove("sp-flying"); setTimeout(()=>document.body.classList.remove("enter"),1100); splashDoneR(); };
    document.body.classList.remove("booting");
    if(reduce){ document.body.classList.add("enter"); sp.classList.add("sp-fade"); setTimeout(finish,520); return; }
    window.scrollTo(0,0);
    document.body.classList.add("sp-flying","enter");
    Map2.refresh(false);
    centerTitle();
    tt.querySelectorAll("span").forEach(s=>{ s.style.animation="none"; s.style.opacity="1"; });
    requestAnimationFrame(()=>{
      const a=tt.getBoundingClientRect(), b=$("#h1t").getBoundingClientRect();
      tt.style.transition="transform .75s cubic-bezier(.6,0,.15,1)";
      tt.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width})`;
      sp.classList.add("sp-exit");
      setTimeout(finish,800);
    });
  }
  const t0=performance.now();
  const fontsOk=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(), new Promise(r=>setTimeout(r,1200))]);
  fontsOk.then(()=>{ centerTitle(); const wait=Math.max(0,2400-(performance.now()-t0)); setTimeout(exit,wait); });
  setTimeout(exit,4000);   // 保險：最多 4 秒
})();
splashDone.then(()=>setTimeout(()=>{ if(!origin){ Van.say("先告訴我從哪裡出發～",2400); } else Van.say("今天想開多遠？",1800); },900));
