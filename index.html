<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="假日骰骰">
<meta name="theme-color" content="#8FD0F5">
<meta name="color-scheme" content="light">
<title>假日骰骰搬家囉！</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B3A55;--ink2:#6B7A93;--sun:#FFD54A;--paper:#FFFBF1;--grass:#8FCF6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:"Huninn","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(180deg,#8FD0F5 0%,#C4E9FC 40%,#EAF7FF 100%) fixed;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 30px)}
.wrap{max-width:460px;margin:0 auto}
.hero{text-align:center}
.hero svg{width:150px;height:110px;display:block;margin:0 auto;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
h1{margin:6px 0 4px;font-weight:400;font-size:30px;white-space:nowrap;text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
.lead{text-align:center;font-size:15px;line-height:1.6;margin-bottom:16px}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:4px 5px 0 rgba(43,58,85,.2)}
.step{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:8px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;flex:none}
.url{display:block;word-break:break-all;font-size:16px;background:#fff;border:2px dashed var(--ink2);border-radius:10px;padding:8px 10px;margin:6px 0 0}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);border-radius:14px;font:inherit;font-size:18px;padding:12px;
  box-shadow:0 4px 0 var(--ink);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--sun)} .btn.n{background:var(--ink);color:#fff;box-shadow:0 4px 0 #17213A}
.note{font-size:14px;color:var(--ink2);line-height:1.6}
textarea{width:100%;min-height:90px;font-size:12px;line-height:1.4;border:2px solid var(--ink);border-radius:10px;padding:8px;margin-top:10px;word-break:break-all;background:#fff;color:var(--ink)}
ol{margin:6px 0 0;padding-left:22px;line-height:1.8;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,16px);opacity:0;transition:.25s;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:8px 16px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:12px;color:var(--ink2);margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 110 80">
      <ellipse cx="57" cy="77" rx="46" ry="3.5" fill="rgba(0,0,0,.18)"/>
      <rect x="30" y="7" width="26" height="12" rx="4" fill="#FFD54A" stroke="#2B3A55" stroke-width="2.6"/><rect x="58" y="10" width="14" height="9" rx="3" fill="#FF8FA3" stroke="#2B3A55" stroke-width="2.4"/>
      <path d="M24 19h56" stroke="#2B3A55" stroke-width="3" stroke-linecap="round"/>
      <path d="M12 60 V40 Q12 19 34 19 H80 Q98 19 104 38 L106 52 Q107 62 97 62 H16 Q12 62 12 60 Z" fill="#FFF6E2"/>
      <path d="M13.7 40 H105 L106 52 Q107 60.3 97 60.3 H16 Q13.7 60.3 13.7 58 Z" fill="#7FD1BE"/>
      <path d="M12 40 H105" stroke="#2B3A55" stroke-width="2.6"/>
      <path d="M12 60 V40 Q12 19 34 19 H80 Q98 19 104 38 L106 52 Q107 62 97 62 H16 Q12 62 12 60 Z" fill="none" stroke="#2B3A55" stroke-width="3.4" stroke-linejoin="round"/>
      <rect x="20" y="25" width="20" height="11" rx="5" fill="#BDE6FB" stroke="#2B3A55" stroke-width="2.6"/><rect x="45" y="25" width="20" height="11" rx="5" fill="#BDE6FB" stroke="#2B3A55" stroke-width="2.6"/>
      <path d="M71 25 H86 Q95 25 99 36 H71 Z" fill="#BDE6FB" stroke="#2B3A55" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M77 45q3.5-4.5 7 0M90 45q3.5-4.5 7 0" fill="none" stroke="#2B3A55" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M83 51q4 6 8 0" fill="#F2735A" stroke="#2B3A55" stroke-width="2.4" stroke-linejoin="round"/>
      <ellipse cx="76" cy="52" rx="4" ry="2.4" fill="#FF9C86"/><ellipse cx="98" cy="52" rx="3.5" ry="2.2" fill="#FF9C86"/>
      <circle cx="104" cy="45" r="3.4" fill="#FFD54A" stroke="#2B3A55" stroke-width="2.2"/>
      <g fill="#2B3A55"><circle cx="32" cy="66" r="10.5"/><circle cx="84" cy="66" r="10.5"/></g><g fill="#FFF3D6"><circle cx="32" cy="66" r="4.6"/><circle cx="84" cy="66" r="4.6"/></g>
    </svg>
    <h1>假日骰骰搬家囉！</h1>
  </div>
  <div class="lead">App 搬到新網址了，舊網址之後會關掉。<br>照下面三步，資料就能一起帶過去。</div>

  <div class="card">
    <div class="step"><i>1</i>複製你的資料</div>
    <div class="note" id="info"></div>
    <button class="btn y" id="copyBtn">複製我的資料</button>
    <textarea id="code" readonly hidden></textarea>
  </div>

  <div class="card">
    <div class="step"><i>2</i>打開新網址，加到主畫面</div>
    <a class="url" id="newUrl"></a>
    <a class="btn n" id="goBtn" target="_blank" rel="noopener">打開新網址</a>
    <div class="note" style="margin-top:10px">打開後按 Safari 下方的「分享」→「加入主畫面」。<br>從 LINE 打開的話，先按右上角改用 Safari 開啟。</div>
  </div>

  <div class="card">
    <div class="step"><i>3</i>在新 App 匯入資料</div>
    <ol>
      <li>從主畫面打開新的「假日骰骰」</li>
      <li>點下方的「足跡」→「匯入資料」</li>
      <li>把剛剛複製的代碼貼上 →「檢查」→「確認匯入」</li>
      <li>確認沒問題，就可以把舊的圖示刪掉了</li>
    </ol>
  </div>
  <footer>Copyright © 2026 大樹</footer>
</div>
<div id="toast"></div>
<script>
const NEW_URL="https://weekend-dice.web.app/";
const SYNC_KEYS=["wd_data","wd_hist","wd_mode","wd_flt","wd_sfx","wd_bgm"];
const $=s=>document.querySelector(s);
const b64e=str=>btoa(unescape(encodeURIComponent(str)));
function get(k){ try{ const v=localStorage.getItem(k); return v===null?undefined:JSON.parse(v); }catch(e){ return undefined; } }
let toastT=0; function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove("show"),2000); }
$("#newUrl").textContent=NEW_URL; $("#newUrl").href=NEW_URL; $("#goBtn").href=NEW_URL;
// 讀舊網址這裡存的資料，打包成跟新 App 一樣格式的代碼（WD1: + base64）
const d={}; SYNC_KEYS.forEach(k=>{ const v=get(k); if(v!==undefined) d[k]=v; });
const dd=d.wd_data||{}, custom=(dd.added||[]).length, changed=Object.keys(dd.edits||{}).length+custom+(dd.deleted||[]).length, hist=(d.wd_hist||[]).length;
const code="WD1:"+b64e(JSON.stringify({app:"weekend-dice",v:1,at:Date.now(),data:d}));
$("#code").value=code;
$("#info").innerHTML = (changed||hist)
  ? `這支手機裡有：自己新增 <b>${custom}</b> 個地點、改過的名單 <b>${changed}</b> 處、足跡 <b>${hist}</b> 筆。`
  : `這裡沒有找到要搬的資料（沒改過名單、也沒有足跡），可以直接跳到第 2 步。<br>如果你是從主畫面圖示打開的舊 App，請在那裡打開這一頁。`;
$("#copyBtn").onclick=async()=>{
  let ok=false;
  try{ await navigator.clipboard.writeText(code); ok=true; }catch(e){}
  if(!ok){ const t=$("#code"); t.hidden=false; t.removeAttribute("readonly"); t.select(); t.setSelectionRange(0,code.length); try{ ok=document.execCommand("copy"); }catch(e){} t.setAttribute("readonly",""); }
  toast(ok?"複製好了！接著做第 2 步":"請長按下面的代碼，全選後複製");
  if(!ok) $("#code").hidden=false;
};
</script>
</body>
</html>
