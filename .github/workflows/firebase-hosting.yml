# push 到 main → 自動部署到 Firebase Hosting 正式網址
# 金鑰放在 GitHub Secrets 的 FIREBASE_SERVICE_ACCOUNT，不會出現在 repo 裡
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 分頁手動按「Run workflow」重新部署

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: weekend-dice
